<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>MDI 부킹 보드</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nanum+Gothic:wght@400;700;800&display=swap">
<style>
/* Layout: 모델 에이전시 사이트형. 흰 고정 헤더(굵은 대문자 워드마크) · 가운데 단계 탭 · 큰 세로 사진 + 가운데 대문자 이름 + 'Label - value' 정보줄 */
:root{
  --bg:#ffffff; --fg:#1b1b1b; --ink:#000000; --muted:#767676; --line:#e5e5e5; --tile:#f3f3f3;
  --pink:#d9609a; --ok:#1f7a4d; --bad:#c0392b;
  --font:"Nanum Gothic","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#101010; --fg:#ececec; --ink:#ffffff; --muted:#9a9a9a; --line:#2a2a2a; --tile:#1b1b1b;
  --pink:#f08cbb; --ok:#5fc48f; --bad:#ff7a6b; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#101010; --fg:#ececec; --ink:#ffffff; --muted:#9a9a9a; --line:#2a2a2a; --tile:#1b1b1b;
  --pink:#f08cbb; --ok:#5fc48f; --bad:#ff7a6b; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:14px;line-height:1.65;margin:0;-webkit-font-smoothing:antialiased;word-break:keep-all}
p,h2,h3{text-wrap:pretty}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible,summary:focus-visible,a:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.gut{padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}
.inner{max-width:1240px;margin:0 auto}

/* 헤더 */
.hd{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.hd .inner{display:flex;justify-content:space-between;align-items:center;gap:16px;height:60px}
.mark{margin:0;font-weight:800;font-size:21px;letter-spacing:-.01em;color:var(--ink);text-transform:uppercase;white-space:nowrap;line-height:1}
.mark span{font-weight:400;font-size:12px;letter-spacing:.14em;color:var(--muted);margin-left:8px;vertical-align:3px}
.me{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--muted)}
.me select{font:700 13px var(--font);color:var(--ink);background:transparent;border:1px solid var(--line);padding:6px 8px;cursor:pointer}

.notice{font-size:12.5px;color:var(--muted);text-align:center;padding-block:10px;border-bottom:1px solid var(--line);margin:0}
.notice b{color:var(--pink);font-weight:700}

/* 단계 탭 */
.tabs{display:flex;gap:30px;padding-block:18px 0;overflow-x:auto;scrollbar-width:none;border-bottom:1px solid var(--line)}
.tabs::-webkit-scrollbar{display:none}
.tabs button{font-size:14px;font-weight:700;color:var(--muted);letter-spacing:.01em;white-space:nowrap;padding-bottom:10px;margin-bottom:-1px;border-bottom:2px solid transparent}
.tabs button:hover{color:var(--ink)}
.tabs button[aria-selected="true"]{color:var(--ink);border-color:var(--ink)}
.tabs .n{font-weight:400;font-size:12px;margin-left:5px;color:var(--pink)}
@media (max-width:640px){.tabs{gap:22px}}

/* 페이지 머리: 왼쪽 제목·설명·요약, 오른쪽 버튼 */
.ph-head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px 24px;flex-wrap:wrap;padding:22px 0 24px}
.ph-head .l{min-width:0;flex:1 1 360px}
.ph-head h2{margin:0;font-size:20px;font-weight:800;letter-spacing:-.01em;color:var(--ink);line-height:1.3;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.ph-head .en{font-size:11px;font-weight:700;letter-spacing:.2em;color:var(--pink)}
.ph-head p{margin:4px 0 0;color:var(--muted);font-size:13px}
.facts{display:flex;flex-wrap:wrap;gap:4px 20px;margin-top:8px;font-size:13px;color:var(--muted)}
.facts b{color:var(--ink);font-weight:800;margin-left:5px;font-variant-numeric:tabular-nums}
.ph-head .r{flex:none}
.ph-head .r .btn{padding:11px 22px}
@media (max-width:640px){.ph-head{position:relative}.ph-head .r{position:absolute;top:18px;right:0}.ph-head .r .btn{padding:8px 14px;font-size:12.5px}.ph-head h2{padding-right:110px}}
.btn{display:inline-block;background:var(--ink);color:var(--bg);font-weight:700;font-size:13.5px;letter-spacing:.04em;padding:13px 34px;border:1px solid var(--ink);transition:opacity .15s}
.btn:hover{opacity:.82}
.btn.line{background:transparent;color:var(--ink)}

/* 그리드 */
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:56px 28px}
@media (max-width:1100px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:780px){.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:44px 14px}}
@media (max-width:460px){.grid{grid-template-columns:minmax(0,1fr)}}
.card{display:flex;flex-direction:column;min-width:0}
.pic{position:relative;aspect-ratio:4/5;max-width:100%;background:var(--tile);overflow:hidden}
.pic .strip{position:absolute;inset:0;display:flex;gap:1px}
.pic img{flex:1;min-width:0;width:100%;height:100%;object-fit:cover}
.noimg{position:absolute;inset:0;display:grid;place-items:center;text-align:center;color:var(--muted);font-size:12.5px}
.noimg b{display:block;font-weight:800;font-size:60px;color:var(--ink);opacity:.12;line-height:1;margin-bottom:12px}
.ex{position:absolute;top:10px;left:10px;background:var(--bg);color:var(--ink);font-size:11px;font-weight:700;padding:3px 8px;letter-spacing:.06em}

.name{margin:16px 0 0;text-align:center;font-weight:800;font-size:15.5px;letter-spacing:.02em;text-transform:uppercase;color:var(--ink);line-height:1.35}
.status{text-align:center;font-size:12.5px;font-weight:700;margin:3px 0 0;font-variant-numeric:tabular-nums;color:var(--pink);letter-spacing:.03em}
.status.soon{color:var(--bad)}
.status.done{color:var(--muted)}
.info{list-style:none;margin:14px 0 0;padding:12px 0 0;border-top:1px solid var(--line);display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:13px}
.info dt{color:var(--muted)}
.info dd{margin:0;color:var(--fg);text-align:right;word-break:break-all}
.info a{color:var(--ink);font-weight:700}

.score{margin-top:16px;padding-top:14px;border-top:1px solid var(--line)}
.score .top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.score .avg{font-size:26px;font-weight:800;color:var(--ink);line-height:1;font-variant-numeric:tabular-nums}
.score .avg small{font-size:13px;font-weight:400;color:var(--muted);margin-left:3px}
.score .st{font-size:12.5px;font-weight:700;color:var(--muted)}
.score .st.ok{color:var(--ok)}
.bar{position:relative;height:4px;background:var(--line);margin-top:10px}
.bar i{position:absolute;left:0;top:0;bottom:0;background:var(--ink)}
.bar i.ok{background:var(--ok)}
.bar .cut{position:absolute;left:60%;top:-4px;height:12px;width:2px;background:var(--pink)}
.bar-lab{display:flex;justify-content:space-between;font-size:11.5px;color:var(--muted);margin-top:4px;position:relative}
.bar-lab .c{position:absolute;left:60%;transform:translateX(-50%);color:var(--pink);font-weight:700}

.vote{display:grid;grid-template-columns:repeat(10,1fr);gap:4px;margin-top:16px}
.vote button{border:1px solid var(--line);padding:8px 0;font-size:13px;font-weight:700;color:var(--fg);font-variant-numeric:tabular-nums;transition:border-color .12s,background .12s,color .12s}
.vote button:hover{border-color:var(--ink)}
.vote button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.mine{font-size:12.5px;color:var(--muted);text-align:center;margin:8px 0 0}
.mine b{color:var(--ink)}

.result{margin-top:16px;padding:11px 14px;display:flex;justify-content:space-between;font-size:13.5px;font-weight:800;border:1px solid currentColor}
.result.pass{color:var(--ok)}
.result.fail{color:var(--bad)}

.who{margin-top:14px;border-top:1px solid var(--line)}
.who summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;align-items:center;padding:11px 0 4px;font-size:13px;font-weight:700;color:var(--ink)}
.who summary::-webkit-details-marker{display:none}
.who summary .c{font-weight:400;color:var(--muted);margin-left:6px}
.who summary .pm{font-size:18px;font-weight:400;line-height:1}
.who summary .pm::before{content:"+"}
.who[open] summary .pm::before{content:"−"}
.who dl{margin:6px 0 0;display:grid;grid-template-columns:1fr auto;gap:5px 10px;font-size:13px}
.who dt{color:var(--fg)}
.who dd{margin:0;font-weight:800;color:var(--ink);font-variant-numeric:tabular-nums}
.who .no{color:var(--muted);font-weight:400}
.by{font-size:12px;color:var(--muted);text-align:center;margin:14px 0 0}

.sec{text-align:left;margin:64px 0 22px;padding-top:22px;border-top:1px solid var(--line);display:flex;align-items:baseline;gap:10px}
.sec .en{font-size:11px;font-weight:700;letter-spacing:.2em;color:var(--muted)}
.sec h3{margin:0;font-size:16px;font-weight:800;color:var(--ink)}
.empty{text-align:center;color:var(--muted);padding:60px 0 90px;font-size:14px;border:1px dashed var(--line)}
.empty b{display:block;font-size:18px;font-weight:800;color:var(--ink);margin-bottom:6px}
main{padding-bottom:120px}
footer{border-top:1px solid var(--line);padding-block:26px;font-size:12px;color:var(--muted)}
footer .inner{display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px}
footer b{color:var(--ink);font-weight:800;letter-spacing:.02em}

/* 등록 패널 */
dialog{margin:0 0 0 auto;height:100%;max-height:100%;width:min(480px,100vw);max-width:100vw;border:0;padding:0;background:var(--bg);color:var(--fg);border-left:1px solid var(--line)}
dialog::backdrop{background:rgba(0,0,0,.4)}
form.reg{padding:calc(26px + env(safe-area-inset-top,0px)) max(26px,env(safe-area-inset-right,0px)) 30px 26px;display:flex;flex-direction:column;gap:20px;min-height:100%}
.reg .top{display:flex;justify-content:space-between;align-items:center;padding-bottom:16px;border-bottom:1px solid var(--line)}
.reg h3{margin:0;font-size:20px;font-weight:800;color:var(--ink)}
.reg .x{font-size:24px;line-height:1;color:var(--ink)}
.reg .hint{margin:-4px 0 0;color:var(--muted);font-size:13px}
.reg label{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:700;color:var(--ink)}
.reg input,.reg textarea{font:400 14px var(--font);color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:0;padding:11px 12px;width:100%;resize:vertical}
.reg input:focus,.reg textarea:focus{outline:none;border-color:var(--ink)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:460px){.row2{grid-template-columns:1fr}}
.drop{border:1px dashed var(--muted);padding:24px 12px;text-align:center;color:var(--muted);font-size:13px;font-weight:400;cursor:pointer;transition:border-color .15s,color .15s}
.drop.on,.drop:hover{border-color:var(--ink);color:var(--ink)}
.drop input{display:none}
.thumbs{display:flex;gap:6px;flex-wrap:wrap}
.thumbs img{width:58px;height:72px;object-fit:cover}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}
.seg button{border:1px solid var(--line);padding:10px 0;font-size:13px;font-weight:700;color:var(--muted)}
.seg button[aria-pressed="true"]{border-color:var(--ink);color:var(--ink);background:var(--tile)}
.err{color:var(--bad);font-size:13px;font-weight:700;margin:0}
.reg .actions{margin-top:auto;display:grid;grid-template-columns:1fr 2fr;gap:8px}
.reg .actions .btn{width:100%;text-align:center}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

</head>
<body>
<style>
/* 로그인·승인대기·관리 화면 */
.auth{max-width:380px;margin:70px auto 120px;display:flex;flex-direction:column;gap:16px}
.auth h2{margin:0;font-size:22px;font-weight:800;color:var(--ink)}
.auth .sub{margin:-8px 0 6px;color:var(--muted);font-size:13px}
.auth label{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:700;color:var(--ink)}
.auth input{font:400 14px var(--font);color:var(--fg);background:var(--bg);border:1px solid var(--line);padding:11px 12px;width:100%}
.auth input:focus{outline:none;border-color:var(--ink)}
.auth .btn{width:100%;text-align:center}
.auth .switch{font-size:13px;color:var(--muted);text-align:center}
.auth .switch button{color:var(--ink);font-weight:700;border-bottom:1px solid var(--ink)}
.msg{font-size:13px;margin:0;font-weight:700}
.msg.err{color:var(--bad)}.msg.ok{color:var(--ok)}
.hd .right{display:flex;align-items:center;gap:16px;font-size:13px}
.hd .right .who{color:var(--fg);font-weight:700}
.hd .right button{color:var(--muted);font-size:12.5px;border-bottom:1px solid var(--line)}
.hd .right button:hover{color:var(--ink);border-color:var(--ink)}
.admin table{width:100%;border-collapse:collapse;font-size:13.5px}
.admin th,.admin td{text-align:left;padding:12px 8px;border-bottom:1px solid var(--line)}
.admin th{font-size:12px;color:var(--muted);font-weight:700}
.admin td .btn{padding:7px 14px;font-size:12.5px}
.admin .tw{overflow-x:auto}
.loading{padding:80px 0;text-align:center;color:var(--muted)}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;font-size:13px;font-weight:700;z-index:20;max-width:calc(100vw - 32px)}
[hidden]{display:none!important}
.pic img{cursor:zoom-in}
.linkrow{display:flex;gap:8px;align-items:flex-end}
.linkrow label{flex:1;min-width:0}
.linkrow .btn{padding:11px 14px;font-size:12.5px;white-space:nowrap}
.pick{display:grid;grid-template-columns:repeat(auto-fill,minmax(78px,1fr));gap:6px}
.pick button{position:relative;aspect-ratio:4/5;background:var(--tile);border:2px solid transparent;overflow:hidden;padding:0}
.pick button img{width:100%;height:100%;object-fit:cover;display:block}
.pick button[aria-pressed="true"]{border-color:var(--ink)}
.pick button[aria-pressed="true"]::after{content:"✓";position:absolute;top:4px;right:4px;background:var(--ink);color:var(--bg);font-size:11px;font-weight:800;width:18px;height:18px;display:grid;place-items:center}
.pickmsg{font-size:12.5px;color:var(--muted);margin:0}
.pickmsg.err{color:var(--bad);font-weight:700}
.getpic{margin-top:10px;width:100%;text-align:center;padding:9px 0;font-size:12.5px}
#pickDlg form{padding:24px;display:flex;flex-direction:column;gap:14px}
#pickDlg h3{margin:0;font-size:18px;font-weight:800;color:var(--ink)}
</style>
<style>
/* 설정창 · 포트폴리오 보기 */
.iconbtn{display:inline-flex;align-items:center;gap:6px}
.iconbtn svg{width:15px;height:15px}
#setDlg form{padding:26px;display:flex;flex-direction:column;gap:18px;min-width:min(360px,calc(100vw - 32px))}
#setDlg{margin:auto;height:auto;width:auto;border:1px solid var(--line)}
#setDlg h3{margin:0;font-size:18px;font-weight:800;color:var(--ink)}
#setDlg .lbl{font-size:13px;font-weight:700;color:var(--ink);margin-bottom:8px}
#setDlg .seg{grid-template-columns:repeat(2,1fr)}
#viewer{margin:0;width:100vw;max-width:100vw;height:100%;max-height:100%;border:0;padding:0;background:var(--bg);color:var(--fg)}
#viewer::backdrop{background:rgba(0,0,0,.6)}
.vw{display:grid;grid-template-rows:auto minmax(0,1fr);height:100%;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.vw-top{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px max(20px,env(safe-area-inset-right,0px)) 14px max(20px,env(safe-area-inset-left,0px));border-bottom:1px solid var(--line)}
.vw-top .t{min-width:0}
.vw-top .t b{display:block;font-size:16px;font-weight:800;color:var(--ink);text-transform:uppercase;letter-spacing:.02em}
.vw-top .t span{font-size:12.5px;color:var(--muted)}
.vw-top .acts{display:flex;align-items:center;gap:14px;font-size:13px;flex:none}
.vw-top .acts a{color:var(--ink);font-weight:700}
.vw-top .x{font-size:26px;line-height:1;color:var(--ink)}
.vw-main{position:relative;min-height:0;background:var(--tile);overflow:hidden;touch-action:none}
.vw-main img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;display:block;transform-origin:0 0;user-select:none;-webkit-user-drag:none;cursor:zoom-in;will-change:transform}
.vw-main.zoomed img{cursor:grab}
.vw-main.zoomed.drag img{cursor:grabbing}
.vw-zoom{position:absolute;right:max(10px,env(safe-area-inset-right,0px));bottom:10px;display:flex;gap:2px;z-index:2}
.vw-zoom button{background:var(--bg);color:var(--ink);font-size:13px;font-weight:700;min-width:34px;height:30px;padding:0 8px;font-variant-numeric:tabular-nums}
.vw-nav,.vw-count{z-index:2}
.vw-nav{position:absolute;top:50%;transform:translateY(-50%);width:44px;height:64px;background:var(--bg);color:var(--ink);font-size:22px;opacity:.85;display:grid;place-items:center}
.vw-nav:hover{opacity:1}
.vw-nav.prev{left:max(10px,env(safe-area-inset-left,0px))}.vw-nav.next{right:max(10px,env(safe-area-inset-right,0px))}
.vw-count{position:absolute;bottom:10px;left:50%;transform:translateX(-50%);background:var(--bg);color:var(--ink);font-size:12px;font-weight:700;padding:3px 10px;font-variant-numeric:tabular-nums}
.vw-msg{padding:40px 20px;text-align:center;color:var(--muted);font-size:14px}
.vw-body{display:grid;grid-template-columns:minmax(0,1fr) 8px minmax(180px,var(--pw));min-height:0}
.vw-body.resizing{user-select:none}
.vw-body.resizing .vw-main img{transition:none}
.vw-split{cursor:col-resize;background:var(--line);position:relative;touch-action:none;outline:none}
.vw-split i{position:absolute;left:50%;top:50%;width:2px;height:36px;transform:translate(-50%,-50%);background:var(--muted);border-radius:1px}
.vw-split:hover,.vw-split:focus-visible,.vw-body.resizing .vw-split{background:var(--muted)}
.vw-panel{display:grid;grid-template-rows:auto 1fr;min-height:0;min-width:0;background:var(--bg)}
.vw-ph{display:flex;align-items:center;gap:8px;padding:10px 14px;border-bottom:1px solid var(--line);font-size:12px;color:var(--muted)}
.vw-ph label{font-weight:700;color:var(--ink);white-space:nowrap}
.vw-ph input{flex:1;min-width:60px;accent-color:var(--ink)}
.vw-ph .sm{font-size:10px}.vw-ph .lg{font-size:16px}
.vw-grid{overflow-y:auto;overscroll-behavior:contain;padding:10px 14px 18px;display:grid;grid-template-columns:repeat(var(--cols,2),minmax(0,1fr));gap:6px;align-content:start}
.vw-grid button{position:relative;display:block;width:100%;height:var(--th,160px);border:2px solid transparent;padding:0;background:var(--tile);overflow:hidden;min-width:0}
.vw-grid button img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.vw-grid button[aria-current="true"]{border-color:var(--ink)}
.vw-grid button:hover{border-color:var(--muted)}
.vw-sec{grid-column:1/-1;display:flex;align-items:baseline;gap:8px;font-size:12px;font-weight:800;color:var(--ink);letter-spacing:.04em;padding:8px 0 2px;text-transform:uppercase}
.vw-sec:not(:first-child){border-top:1px solid var(--line);margin-top:6px;padding-top:12px}
.vw-sec span{font-weight:400;color:var(--muted)}
@media (max-width:760px){
  .vw-body{grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(120px,1fr) 10px minmax(110px,var(--ph))}
  .vw-split{cursor:row-resize}
  .vw-split i{width:36px;height:2px}
}
.meas{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}

function authView(mode="login",msg=""){
  authMode=mode;
  hdRight.innerHTML=setBtnHtml();bindSetBtn();
  root.innerHTML=`<form class="auth" id="authForm" novalidate>
    <h2>${mode==="login"?T("login"):T("signup")}</h2>
    <p class="sub">${mode==="login"?T("loginSub"):T("signupSub")}</p>
    ${mode==="signup"?`<label for="a-name">${T("nameOrTitle")}<input id="a-name" autocomplete="name" required></label>`:""}
    <label for="a-email">${T("email")}<input id="a-email" type="email" autocomplete="email" required></label>
    <label for="a-pw">${T("password")}<input id="a-pw" type="password" autocomplete="${mode==="login"?"current-password":"new-password"}" required minlength="6"></label>
    <p class="msg" id="aMsg" ${msg?"":"hidden"}>${esc(msg)}</p>
    <button class="btn" type="submit">${mode==="login"?T("doLogin"):T("doSignup")}</button>
    <p class="switch">${mode==="login"?`${T("firstTime")} <button type="button" id="aSwitch">${T("doSignup")}</button>`:`${T("haveAcct")} <button type="button" id="aSwitch">${T("doLogin")}</button>`}</p>
  </form>`;
  document.getElementById("aSwitch").onclick=()=>authView(mode==="login"?"signup":"login");
  const f=document.getElementById("authForm"),m=document.getElementById("aMsg");
  const say=(t,ok)=>{m.textContent=t;m.className="msg "+(ok?"ok":"err");m.hidden=false};
  f.onsubmit=async e=>{
    e.preventDefault();
    const email=document.getElementById("a-email").value.trim(),pw=document.getElementById("a-pw").value;
    if(!email||!pw)return say(T("needEmailPw"));
    const btn=f.querySelector("button[type=submit]");btn.disabled=true;
    if(mode==="login"){
      const {error}=await sb.auth.signInWithPassword({email,password:pw});
      btn.disabled=false;
      if(error)say(/confirm/i.test(error.message)?T("notConfirmed"):T("badLogin"));
    }else{
      const name=document.getElementById("a-name").value.trim();
      if(!name){btn.disabled=false;return say(T("needName"))}
      if(pw.length<6){btn.disabled=false;return say(T("pwShort"))}
      const {data,error}=await sb.auth.signUp({email,password:pw,options:{data:{display_name:name},emailRedirectTo:location.origin+location.pathname}});
      btn.disabled=false;
      if(error)return say(T("signupFail")+error.message);
      if(!data.session)authView("login",T("signupDone"));
    }
  };
}
function pendingView(){
  hdRight.innerHTML=`${setBtnHtml()}<span class="who">${esc(profile?.display_name||me.email)}</span><button id="logout">${T("logout")}</button>`;
  bindSetBtn();document.getElementById("logout").onclick=()=>sb.auth.signOut();

/* ---------- 데이터 ---------- */
const name=uid=>members.find(m=>m.id===uid)?.display_name||T("unknown");
const approvedMembers=()=>members.filter(m=>m.approved);
function vOf(cid){return votes.filter(v=>v.candidate_id===cid)}
function stats(it){const v=vOf(it.id).map(x=>x.score);const n=v.length;const avg=n?v.reduce((a,b)=>a+b,0)/n:0;return {n,avg,pct:avg/10}}
const deadline=it=>new Date(it.deadline).getTime();
const closed=it=>Date.now()>=deadline(it);
function passed(it){const s=stats(it);return s.n>0&&s.pct>=PASS}
function stageOf(it){if(it.withdrawn_at)return "withdrawn";if(!closed(it))return "cand";return passed(it)?"contact":"cand"}
function left(ms){if(ms<=0)return T("closedAt");const s=Math.floor(ms/1000),d=Math.floor(s/86400),h=Math.floor(s%86400/3600),m=Math.floor(s%3600/60),x=s%60,p=n=>String(n).padStart(2,"0");return (d?d+T("day"):"")+p(h)+":"+p(m)+":"+p(x)}

async function signPaths(paths){
  const need=[...new Set(paths)].filter(x=>!photoUrls[x]);
  if(!need.length)return;
  const {data}=await sb.storage.from(BUCKET).createSignedUrls(need,60*60*6);
  (data||[]).forEach(d=>{if(d.signedUrl)photoUrls[d.path]=d.signedUrl});
}
async function loadAll(){
  const [c,v,p]=await Promise.all([
    sb.from("candidates").select("*").order("created_at",{ascending:false}),
    sb.from("votes").select("candidate_id,user_id,score"),
    sb.from("profiles").select("id,display_name,role,approved,created_at").order("created_at")
  ]);
  if(c.error||v.error||p.error)throw (c.error||v.error||p.error);
  items=c.data;votes=v.data;members=p.data;
  await signPaths(items.flatMap(i=>i.photos.slice(0,2)));
}
let reloadT=null;
function scheduleReload(){clearTimeout(reloadT);reloadT=setTimeout(async()=>{try{await loadAll();render()}catch(e){console.error(e)}},300)}
function subscribe(){
  if(channel)return;
  channel=sb.channel("board").on("postgres_changes",{event:"*",schema:"public",table:"candidates"},scheduleReload)
    .on("postgres_changes",{event:"*",schema:"public",table:"votes"},scheduleReload).subscribe();
}

function head(stage,desc,extra="",right=""){return `<section class="ph-head"><div class="l"><h2>${SN(stage)}<span class="en">${EN[stage]}</span></h2>${desc?`<p>${desc}</p>`:""}${extra}</div>${right?`<div class="r">${right}</div>`:""}</section>`}

function sizeLine(it){
  const three=[it.bust,it.waist,it.hips].some(Boolean)?[it.bust||"–",it.waist||"–",it.hips||"–"].join(" - "):"";
  return [it.height,three,it.shoe].filter(Boolean).join(" / ");
}
function card(it){
  const s=stats(it),dl=deadline(it),rem=dl-Date.now(),isClosed=rem<=0,ok=passed(it);
  const mine=vOf(it.id).find(v=>v.user_id===me.id)?.score;
  const urls=it.photos.slice(0,2).map(p=>photoUrls[p]).filter(Boolean);
  const total=it.photos.length+(it.gallery?.length||0)+(it.snaps?.length||0);
  const media=urls.length?`<div class="strip">${urls.map(u=>`<img src="${esc(u)}" alt="${esc(it.name)}">`).join("")}</div>`
    :`<div class="noimg"><div><b>${esc((it.name||"?").trim().charAt(0).toUpperCase())}</b>${it.photos.length?T("photoLoading"):(it.link?T("linkNoPhoto"):T("noPhoto"))}</div></div>`;
  const scls=isClosed?"done":(rem<12*H?"soon":"");
  const g=it.gtype==="yes"?esc(it.gamt||T("gNoAmt")):it.gtype==="no"?T("gNone"):T("gTbd");
  const voters=approvedMembers();
  const vmap=Object.fromEntries(vOf(it.id).map(v=>[v.user_id,v.score]));
  const P=n=>n+T("pts");
  const canView=urls.length||it.link||total;
  return `<article class="card" data-card="${it.id}">
    <div class="pic" ${canView?`data-view="${it.id}" role="button" tabindex="0" aria-label="${esc(it.name)} ${T("vwPortfolio")}"`:""}>${media}${!it.withdrawn_at&&(it.created_by===me.id||profile.role==="admin")?(wdAsk.has(it.id)?`<div class="wdov"><p>${T("wdAsk")}</p><div><button type="button" class="btn" data-wdyes="${it.id}">${T("wdYes")}</button><button type="button" class="btn line" data-wdno="${it.id}">${T("cancel")}</button></div></div>`:`<button type="button" class="wdx" data-wd="${it.id}" title="${T("withdraw")}" aria-label="${T("withdraw")}">×</button>`):""}${canView&&total>1?`<span class="more">${T("vwPortfolio")}${total>1?" "+total+T("photosN"):""}</span>`:canView&&it.link?`<span class="more">${T("vwPortfolio")}</span>`:""}</div>
    <p class="name">${esc(it.name)}</p>
    ${sizeLine(it)?`<p class="sizeline" title="${T("sizeTitle")}">${esc(sizeLine(it))}</p>`:""}
    ${(it.nationality||it.age)?`<p class="subline">${[it.nationality,it.age?it.age+T("ageUnit"):""].filter(Boolean).map(esc).join(" · ")}</p>`:""}
    <p class="status ${scls}" data-timer="${it.id}">${isClosed?`${T("closedAt")} ${fmt(dl)}`:`${T("left")} <span data-left="${it.id}" data-dl="${dl}">${left(rem)}</span>`}</p>
    <dl class="info">
      <dt>${T("agency")}</dt><dd>${esc(it.agency||T("notEntered"))}</dd>
      <dt>${T("guarantee")}</dt><dd>${g}</dd>
      ${it.link?`<dt>${T("link")}</dt><dd><a href="${esc(it.link)}" target="_blank" rel="noopener">${T("open")}</a></dd>`:""}
      ${it.memo?`<dt>${T("memo")}</dt><dd>${esc(it.memo)}</dd>`:""}
    </dl>
    <div class="score">
      <div class="top"><span class="avg">${s.n?s.avg.toFixed(1):"–"}<small>/ 10</small></span><span class="st ${ok?"ok":""}">${s.n?`${Math.round(s.pct*100)}% · ${ok?T("passUp"):T("passDown")}`:T("noVotes")}</span></div>
      <div class="bar" title="${T("passLine")}"><i class="${ok?"ok":""}" style="width:${Math.min(100,s.pct*100)}%"></i><span class="cut"></span></div>
      <div class="bar-lab"><span>0</span><span class="c">6.0</span><span>10</span></div>
    </div>
    ${isClosed?`<div class="result ${ok?"pass":"fail"}"><span>${ok?T("resPass"):T("resFail")}</span><span>${s.n?s.avg.toFixed(1)+T("pts"):T("noVotes")}</span></div>`
      :`<div class="vote" role="group" aria-label="${esc(it.name)}">${Array.from({length:10},(_,i)=>i+1).map(n=>`<button type="button" data-v="${n}" data-id="${it.id}" aria-pressed="${mine===n}" aria-label="${n}">${n}</button>`).join("")}</div>
        <p class="mine">${mine?`${T("myScore")} <b>${P(mine)}</b> · ${T("changeHint")}`:T("notVoted")}</p>`}
    <details class="who" data-whobox="${it.id}" ${openWho.has(it.id)?"open":""}>
      <summary><span>${T("voters")}<span class="c">${s.n}/${voters.length}${T("ppl")}</span></span><span class="pm" aria-hidden="true"></span></summary>
      <dl>${voters.map(m=>vmap[m.id]!=null?`<dt>${esc(m.display_name)}</dt><dd>${P(vmap[m.id])}</dd>`:`<dt class="no">${esc(m.display_name)}</dt><dd class="no">${T("noVote")}</dd>`).join("")}</dl>
    </details>
    ${it.link&&!it.photos.length&&(it.created_by===me.id||profile.role==="admin")?`<button class="btn line getpic" data-getpic="${it.id}">${T("getPic")}</button>`:""}
    <p class="by">${T("regBy")} ${esc(name(it.created_by))} · ${fmt(it.created_at)}</p>
  </article>`;
}

function render(){
  header();
  try{localStorage.setItem("mdi-tab2",tab)}catch(e){}
  if(tab==="admin")return adminView();
  const list=items.filter(it=>stageOf(it)===tab);
  let html=tabsHtml();
  if(tab==="cand"){
    const open=list.filter(it=>!closed(it)).sort((a,b)=>deadline(a)-deadline(b));
    const fail=list.filter(it=>closed(it));
    const soon=open.filter(it=>deadline(it)-Date.now()<24*H).length;
    const notMine=open.filter(it=>!vOf(it.id).some(v=>v.user_id===me.id)).length;
    const isSoon=it=>deadline(it)-Date.now()<24*H, isTodo=it=>!vOf(it.id).some(v=>v.user_id===me.id);
    const shown=filter==="soon"?open.filter(isSoon):filter==="todo"?open.filter(isTodo):open;
    const fb=(k,label,n)=>`<button type="button" data-filter="${k}" aria-pressed="${filter===k}">${label}<b>${n}</b></button>`;
    const wds=items.filter(it=>it.withdrawn_at&&(it.created_by===me.id||profile.role==="admin"));
    html+=head("cand",T("candDesc"),
        `<div class="facts">${fb("all",T("voting"),open.length)}${fb("soon",T("soon24"),soon)}${fb("todo",T("myTodo"),notMine)}</div>`,
        `<button class="btn" id="openReg">${T("addCand")}</button>`)+
      (filter!=="all"?`<p class="fnote">${T("fShowing")} ${filter==="soon"?T("soon24"):T("myTodo")} · ${shown.length}<button type="button" data-filter="all">${T("fAll")}</button></p>`:"")+
      (shown.length?`<div class="grid">${shown.map(card).join("")}</div>`:(open.length?`<div class="empty"><b>${T("fNone")}</b></div>`:`<div class="empty"><b>${T("emptyCand")}</b>${T("emptyCandSub")}</div>`))+
      (fail.length&&filter==="all"?`<div class="sec"><h3>${T("closedFail")} ${fail.length}</h3><span class="en">CLOSED</span></div><div class="grid">${fail.map(card).join("")}</div>`:"")+
      (wds.length&&filter==="all"?`<details class="wdlist sec" style="display:block"><summary>${T("wdList")} ${wds.length} +</summary><ul>${wds.map(it=>`<li><span><b>${esc(it.name)}</b> · ${esc(it.agency||"")}</span><span>${T("wdBy")} ${esc(name(it.withdrawn_by))} · ${fmt(it.withdrawn_at)}</span><button class="btn line" style="padding:6px 12px;font-size:12px" data-restore="${it.id}">${T("restore")}</button></li>`).join("")}</ul></details>`:"");
  }else if(tab==="contact"){
    html+=head("contact",T("contactDesc"))+
      (list.length?`<div class="grid">${list.map(card).join("")}</div>`:`<div class="empty"><b>${T("emptyContact")}</b>${T("emptyContactSub")}</div>`);
  }else{
    html+=head(tab,"")+`<div class="empty"><b>${T("soonTitle")}</b>${SN(tab)} · ${T("soonSub")}</div>`;
  }
  root.innerHTML=html;
  root.querySelectorAll("[data-tab]").forEach(b=>b.onclick=()=>{tab=b.dataset.tab;render()});
  const o=document.getElementById("openReg");if(o)o.onclick=openReg;
  root.querySelectorAll("[data-whobox]").forEach(d=>d.ontoggle=()=>{d.open?openWho.add(d.dataset.whobox):openWho.delete(d.dataset.whobox)});
  root.querySelectorAll("[data-filter]").forEach(b=>b.onclick=()=>{const k=b.dataset.filter;filter=(filter===k&&k!=="all")?"all":k;render()});
  root.querySelectorAll("[data-wd]").forEach(b=>b.onclick=e=>{e.stopPropagation();wdAsk.add(b.dataset.wd);render()});
  root.querySelectorAll("[data-wdno]").forEach(b=>b.onclick=e=>{e.stopPropagation();wdAsk.delete(b.dataset.wdno);render()});
  root.querySelectorAll("[data-wdyes]").forEach(b=>b.onclick=async e=>{e.stopPropagation();
    b.disabled=true;const id=b.dataset.wdyes;
    const {error}=await sb.from("candidates").update({withdrawn_at:new Date().toISOString()}).eq("id",id);
    wdAsk.delete(id);
    if(error)toast(T("wdFail")+error.message);else toast(T("wdDone"));
    await loadAll();render();
  });
  root.querySelectorAll("[data-restore]").forEach(b=>b.onclick=async()=>{
    b.disabled=true;
    const {error}=await sb.from("candidates").update({withdrawn_at:null}).eq("id",b.dataset.restore);
    if(error)toast(T("wdFail")+error.message);else toast(T("restored"));
    await loadAll();render();
  });
  root.querySelectorAll("[data-getpic]").forEach(b=>b.onclick=()=>openPickFor(items.find(x=>x.id===b.dataset.getpic)));
  root.querySelectorAll("[data-view]").forEach(el=>{const go=()=>openViewer(items.find(x=>x.id===el.dataset.view));el.onclick=e=>{if(e.target.closest(".wdx,.wdov"))return;go()};el.onkeydown=e=>{if(e.target!==el)return;if(e.key==="Enter"||e.key===" "){e.preventDefault();go()}}});
  root.querySelectorAll(".vote button").forEach(b=>b.onclick=async()=>{
    const it=items.find(x=>x.id===b.dataset.id);if(!it||closed(it))return;
    const score=+b.dataset.v;
    const prev=votes.find(v=>v.candidate_id===it.id&&v.user_id===me.id);
    if(prev)prev.score=score;else votes.push({candidate_id:it.id,user_id:me.id,score});
    render();
    const {error}=await sb.from("votes").upsert({candidate_id:it.id,user_id:me.id,score,updated_at:new Date().toISOString()},{onConflict:"candidate_id,user_id"});
    if(error){toast(T("voteFail")+error.message);await loadAll();render()}
  });
}

function dropBroken(k){

/* 패널 경계 끌어서 폭(폰은 높이) 조절 */
function setupSplit(){
  const sp=document.getElementById("vwSplit"),body=document.getElementById("vwBody");if(!sp)return;
  let st=null;
  sp.addEventListener("pointerdown",e=>{sp.setPointerCapture(e.pointerId);st={x:e.clientX,y:e.clientY,pw:VS.pw,ph:VS.ph};body.classList.add("resizing")});
  sp.addEventListener("pointermove",e=>{if(!st)return;const r=body.getBoundingClientRect();
    if(narrow()){VS.ph=Math.round(Math.min(r.height-120,Math.max(110,st.ph-(e.clientY-st.y))));body.style.setProperty("--ph",VS.ph+"px")}
    else{VS.pw=Math.round(Math.min(r.width-240,Math.max(180,st.pw-(e.clientX-st.x))));body.style.setProperty("--pw",VS.pw+"px")}});
  const done=()=>{if(st){st=null;body.classList.remove("resizing");saveVS();resetZoom&&resetZoom()}};
  sp.addEventListener("pointerup",done);sp.addEventListener("pointercancel",done);
  sp.addEventListener("keydown",e=>{const k=e.key;let d=0;if(k==="ArrowLeft"||k==="ArrowUp")d=20;else if(k==="ArrowRight"||k==="ArrowDown")d=-20;else return;e.preventDefault();e.stopPropagation();
    if(narrow()){VS.ph=Math.max(110,VS.ph+d);body.style.setProperty("--ph",VS.ph+"px")}else{VS.pw=Math.max(180,VS.pw+d);body.style.setProperty("--pw",VS.pw+"px")}saveVS()});

/* 확대·축소: 마우스 휠, 두 손가락 벌리기, 두 번 누르기, +/− 버튼. 확대 중에는 끌어서 이동 */
let Z={s:1,x:0,y:0},resetZoom=null,layoutGrid=null;
function setupZoom(){
  const main=document.getElementById("vwMain");
  Z={s:1,x:0,y:0};
  if(!main||!document.getElementById("vwImg"))return;
  const img=()=>document.getElementById("vwImg");
  const MAX=6;
  const rect=()=>main.getBoundingClientRect();
  const apply=()=>{const r=rect();if(Z.s<=1.001){Z={s:1,x:0,y:0}}else{Z.x=Math.min(0,Math.max(r.width-r.width*Z.s,Z.x));Z.y=Math.min(0,Math.max(r.height-r.height*Z.s,Z.y))}
    img().style.transform=`translate(${Z.x}px,${Z.y}px) scale(${Z.s})`;main.classList.toggle("zoomed",Z.s>1)};
  resetZoom=()=>{Z={s:1,x:0,y:0};apply()};
  const zoomAt=(ns,px,py)=>{ns=Math.min(MAX,Math.max(1,ns));Z.x=px-(px-Z.x)*(ns/Z.s);Z.y=py-(py-Z.y)*(ns/Z.s);Z.s=ns;apply()};
  const center=()=>{const r=rect();return [r.width/2,r.height/2]};
  window.__vwZoom=()=>({...Z});
  main.addEventListener("wheel",e=>{e.preventDefault();const r=rect();zoomAt(Z.s*Math.exp(-e.deltaY*0.0015),e.clientX-r.left,e.clientY-r.top)},{passive:false});
  document.getElementById("zIn").onclick=()=>{const [cx,cy]=center();zoomAt(Z.s*1.5,cx,cy)};
  document.getElementById("zOut").onclick=()=>{const [cx,cy]=center();zoomAt(Z.s/1.5,cx,cy)};
  document.getElementById("zFit").onclick=()=>resetZoom();
  const pts=new Map();let start=null,pinch=null,lastTap=0;
  main.addEventListener("pointerdown",e=>{
    if(e.target.closest("button"))return;
    main.setPointerCapture(e.pointerId);pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
    if(pts.size===1){start={x:e.clientX,y:e.clientY,zx:Z.x,zy:Z.y,t:Date.now()};main.classList.add("drag")}
    if(pts.size===2){const [a,b]=[...pts.values()];const r=rect();pinch={d:Math.hypot(a.x-b.x,a.y-b.y),s:Z.s,mx:(a.x+b.x)/2-r.left,my:(a.y+b.y)/2-r.top,zx:Z.x,zy:Z.y};start=null}
  });
  main.addEventListener("pointermove",e=>{
    if(!pts.has(e.pointerId))return;pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
    if(pinch&&pts.size>=2){const [a,b]=[...pts.values()];const r=rect();const d=Math.hypot(a.x-b.x,a.y-b.y),mx=(a.x+b.x)/2-r.left,my=(a.y+b.y)/2-r.top;
      const ns=Math.min(MAX,Math.max(1,pinch.s*d/pinch.d));
      Z.s=ns;Z.x=mx-(pinch.mx-pinch.zx)*(ns/pinch.s);Z.y=my-(pinch.my-pinch.zy)*(ns/pinch.s);apply();return}
    if(start&&Z.s>1){Z.x=start.zx+(e.clientX-start.x);Z.y=start.zy+(e.clientY-start.y);apply()}
  });
  const end=e=>{
    if(!pts.has(e.pointerId))return;pts.delete(e.pointerId);
    if(pts.size<2)pinch=null;
    if(pts.size===0){
      main.classList.remove("drag");
      if(start){
        const dx=e.clientX-start.x,dy=e.clientY-start.y,moved=Math.hypot(dx,dy);
        if(Z.s<=1&&Math.abs(dx)>50&&Math.abs(dx)>Math.abs(dy))go(dx<0?1:-1);
        else if(moved<8){const now=Date.now();const r=rect();if(now-lastTap<300){if(Z.s>1)resetZoom();else zoomAt(2.5,e.clientX-r.left,e.clientY-r.top);lastTap=0}else lastTap=now}
      }
      start=null;
    }else if(pts.size===1){const [a]=[...pts.values()];start={x:a.x,y:a.y,zx:Z.x,zy:Z.y,t:Date.now()}}
  };
  main.addEventListener("pointerup",end);main.addEventListener("pointercancel",end);
  apply();
}
document.addEventListener("keydown",e=>{if(!viewer.open||e.target.closest?.("input,#vwSplit"))return;if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1)});

  subscribe();render();autoFill();
}
/* 링크만 있고 사진이 없는 내 후보(관리자는 전체)는 메인 사진·포트폴리오를 자동으로 채움 — 세션당 1회 */
const autoTried=new Set();
async function autoFill(){
  const targets=items.filter(it=>!it.withdrawn_at&&it.link&&!it.photos.length&&!autoTried.has(it.id)&&(it.created_by===me.id||profile.role==="admin"));
  for(const it of targets){
    autoTried.add(it.id);
    try{
      const r=await scanLink(it.link);
      if(!r.suggested)continue;
      const im=await importImages([r.suggested],r.url||it.link);
      const patch={};
      if(im.paths.length)patch.photos=im.paths;
      if(!it.gallery?.length&&r.gallery?.length)patch.gallery=r.gallery.slice(0,200);
      if(!it.snaps?.length&&r.snaps?.length)patch.snaps=r.snaps.slice(0,200);
      if(Object.keys(patch).length)await sb.from("candidates").update(patch).eq("id",it.id);
    }catch(e){console.warn("autofill",it.id,e.message)}
  }
  if(targets.length){try{await loadAll();if(tab!=="admin")render()}catch(e){}}
}
let lastUid;
sb.auth.onAuthStateChange((ev,session)=>{
  const uid=session?.user?.id||null;
  if(ev==="TOKEN_REFRESHED"&&uid===lastUid)return;
  lastUid=uid;setTimeout(()=>boot(session),0);
});
})();
</script>
