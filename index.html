<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>MDI 부킹 보드</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
/* Layout: 모델 에이전시 사이트형. 흰 고정 헤더(굵은 대문자 워드마크) · 가운데 단계 탭 · 큰 세로 사진 + 가운데 대문자 이름 + 'Label - value' 정보줄 */
:root{
  --bg:#ffffff; --fg:#1b1b1b; --ink:#000000; --muted:#767676; --line:#e5e5e5; --tile:#f3f3f3;
  --pink:#ff2b2b; --red:#ff2b2b; --ok:#000000; --bad:#000000; --acc:#ff2b2b; --accbg:transparent; --accbg2:#f2f2f2; --muted:#8a8a8a; --line:#ececec;
  --font:"Pretendard","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#101010; --fg:#ececec; --ink:#ffffff; --muted:#9a9a9a; --line:#2a2a2a; --tile:#1b1b1b;
  --pink:#ff5a52; --red:#ff5a52; --ok:#ffffff; --bad:#ffffff; --acc:#ff5a52; --accbg:transparent; --accbg2:#1f1f1f; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#101010; --fg:#ececec; --ink:#ffffff; --muted:#9a9a9a; --line:#2a2a2a; --tile:#1b1b1b;
  --pink:#ff5a52; --red:#ff5a52; --ok:#ffffff; --bad:#ffffff; --acc:#ff5a52; --accbg:transparent; --accbg2:#1f1f1f; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:14px;line-height:1.65;margin:0;-webkit-font-smoothing:antialiased;word-break:keep-all}
p,h2,h3{text-wrap:pretty}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
dialog:focus{outline:none}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible,summary:focus-visible,a:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.gut{padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}
.inner{max-width:1240px;margin:0 auto}

/* 헤더 */
.hd{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.hd .inner{display:flex;justify-content:space-between;align-items:center;gap:16px;height:60px}
.mark{margin:0;font-weight:800;font-size:21px;letter-spacing:-.01em;color:var(--ink);text-transform:uppercase;white-space:nowrap;line-height:1}
.mark span{font-weight:400;font-size:12px;letter-spacing:.14em;color:var(--muted);margin-left:8px;vertical-align:3px}
.me{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--muted)}
.me select{font:700 13px var(--font);color:var(--ink);background:transparent;border:1px solid var(--line);padding:6px 8px;cursor:pointer}

.notice{font-size:12.5px;color:var(--muted);text-align:center;padding-block:10px;border-bottom:1px solid var(--line);margin:0}
.notice b{color:var(--pink);font-weight:700}

/* 단계 탭 */
.tabs{display:flex;gap:30px;padding-block:18px 0;overflow-x:auto;scrollbar-width:none;border-bottom:1px solid var(--line);position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
.tabs::-webkit-scrollbar{display:none}
.tabs button{font-size:14px;font-weight:700;color:var(--muted);letter-spacing:.01em;white-space:nowrap;padding-bottom:10px;margin-bottom:-1px;border-bottom:2px solid transparent}
.tabs button:hover{color:var(--ink)}
.tabs button[aria-selected="true"]{color:var(--ink);border-color:var(--ink)}
.tabs .n{font-weight:400;font-size:12px;margin-left:5px;color:var(--pink)}
@media (max-width:640px){.tabs{gap:22px}}

/* 페이지 머리: 왼쪽 제목·설명·요약, 오른쪽 버튼 */
.ph-head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px 24px;flex-wrap:wrap;padding:22px 0 24px}
.ph-head .l{min-width:0;flex:1 1 360px}
.ph-head h2{margin:0;font-size:20px;font-weight:800;letter-spacing:-.01em;color:var(--ink);line-height:1.3;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.ph-head .en{font-size:11px;font-weight:700;letter-spacing:.2em;color:var(--pink)}
.ph-head p{margin:4px 0 0;color:var(--muted);font-size:13px}
.facts{display:flex;flex-wrap:wrap;gap:4px 20px;margin-top:8px;font-size:13px;color:var(--muted)}
.facts b{color:var(--ink);font-weight:800;margin-left:5px;font-variant-numeric:tabular-nums}
.ph-head .r{flex:none}
.ph-head .r .btn{padding:4px 10px;font-size:11.5px;line-height:1.3;letter-spacing:.02em;background:var(--accbg);color:var(--acc);border-color:transparent}
.ph-head .r .btn:hover{opacity:1;background:var(--accbg2)}
@media (max-width:640px){.ph-head{position:relative}.ph-head .r{position:absolute;top:18px;right:0}.ph-head .r .btn{padding:3px 8px;font-size:11px;line-height:1.3;letter-spacing:0}.ph-head h2{padding-right:70px}}
.btn{display:inline-block;background:var(--ink);color:var(--bg);font-weight:700;font-size:13.5px;letter-spacing:.04em;padding:13px 34px;border:1px solid var(--ink);transition:opacity .15s}
.btn:hover{opacity:.82}
.btn.line{background:transparent;color:var(--ink)}

/* 그리드 */
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:56px 28px}
@media (max-width:1100px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:780px){.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:44px 14px}}
@media (max-width:460px){.grid{grid-template-columns:minmax(0,1fr)}}
.card{display:flex;flex-direction:column;min-width:0}
.pic{position:relative;aspect-ratio:4/5;max-width:100%;background:var(--tile);overflow:hidden}
.pic .strip{position:absolute;inset:0;display:flex;gap:1px}
.pic img{flex:1;min-width:0;width:100%;height:100%;object-fit:cover}
.noimg{position:absolute;inset:0;display:grid;place-items:center;text-align:center;color:var(--muted);font-size:12.5px}
.noimg b{display:block;font-weight:800;font-size:60px;color:var(--ink);opacity:.12;line-height:1;margin-bottom:12px}
.ex{position:absolute;top:10px;left:10px;background:var(--bg);color:var(--ink);font-size:11px;font-weight:700;padding:3px 8px;letter-spacing:.06em}

/* 남은 시간 줄은 항상 치수 3번째 줄(Shoes)과 같은 높이: 왼쪽 칸 최소 높이 = 치수 3줄, 두 칸 모두 아래 정렬 */
.meta{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;margin-top:14px}
.meta .ml{min-width:0;flex:1 1 auto;display:flex;flex-direction:column;min-height:57px}
.meta .ml .status{margin:auto 0 0;line-height:19px}
.meta .ml .subline{margin:0;line-height:17px}
.meta .ml .name{line-height:21px}
.meta .mr{flex:none;min-height:57px;text-align:right;font-size:12.5px;font-weight:400;color:var(--ink);line-height:19px;font-variant-numeric:tabular-nums;white-space:nowrap}
.meta .mr p{margin:0}
.meta .name,.meta .status,.meta .subline{text-align:left}
.meta .name{margin:0;word-break:break-word}
.name{margin:16px 0 0;text-align:center;font-weight:800;font-size:15.5px;letter-spacing:.02em;text-transform:uppercase;color:var(--ink);line-height:1.35}
.status{text-align:center;font-size:12.5px;font-weight:700;margin:3px 0 0;font-variant-numeric:tabular-nums;color:var(--pink);letter-spacing:.03em}
.status.soon{color:var(--bad)}
.status.done{color:var(--muted)}
.info{list-style:none;margin:14px 0 0;padding:12px 0 0;border-top:1px solid var(--line);display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:13px}
.info dt{color:var(--muted)}
.info dd{margin:0;color:var(--fg);text-align:right;word-break:break-all}
.info a{color:var(--ink);font-weight:700}

.score{margin-top:16px;padding-top:14px;border-top:1px solid var(--line)}
.score .top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.score .avg{font-size:26px;font-weight:800;color:var(--ink);line-height:1;font-variant-numeric:tabular-nums}
.score .avg small{font-size:13px;font-weight:400;color:var(--muted);margin-left:3px}
.score .st{font-size:12.5px;font-weight:700;color:var(--muted)}
.score .st.ok{color:var(--ok)}
.bar{position:relative;height:4px;background:var(--line);margin-top:10px}
.bar i{position:absolute;left:0;top:0;bottom:0;background:var(--ink)}
.bar i.ok{background:var(--ok)}
.bar .cut{position:absolute;left:60%;top:-4px;height:12px;width:2px;background:var(--pink)}
.bar-lab{display:flex;justify-content:space-between;font-size:11.5px;color:var(--muted);margin-top:4px;position:relative}
.bar-lab .c{position:absolute;left:60%;transform:translateX(-50%);color:var(--pink);font-weight:700}

.vote{display:grid;grid-template-columns:repeat(10,1fr);gap:4px;margin-top:16px}
.vote button{border:1px solid var(--line);padding:8px 0;font-size:13px;font-weight:700;color:var(--fg);font-variant-numeric:tabular-nums;transition:border-color .12s,background .12s,color .12s}
.vote button:hover{border-color:var(--ink)}
.vote button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.mine{font-size:12.5px;color:var(--muted);text-align:center;margin:8px 0 0}
.mine b{color:var(--ink)}

.result{margin-top:16px;padding:11px 14px;display:flex;justify-content:space-between;font-size:13.5px;font-weight:800;border:1px solid currentColor}
.result.pass{color:var(--ok)}
.result.fail{color:var(--bad)}

.who{margin-top:14px;border-top:1px solid var(--line)}
.who summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;align-items:center;padding:11px 0 4px;font-size:13px;font-weight:700;color:var(--ink)}
.who summary::-webkit-details-marker{display:none}
.who summary .c{font-weight:400;color:var(--muted);margin-left:6px}
.who summary .pm{width:18px;height:18px;display:grid;place-items:center;flex:none}
.who summary .pm::before{content:"";width:7px;height:7px;border-right:1.6px solid currentColor;border-bottom:1.6px solid currentColor;transform:translateY(-2px) rotate(45deg);transition:transform .15s}
.who[open] summary .pm::before{transform:translateY(2px) rotate(-135deg)}
.who dl{margin:6px 0 0;display:grid;grid-template-columns:1fr auto;gap:5px 10px;font-size:13px}
.who dt{color:var(--fg)}
.who dd{margin:0;font-weight:800;color:var(--ink);font-variant-numeric:tabular-nums}
.who .no{color:var(--muted);font-weight:400}
.by{font-size:12px;color:var(--muted);text-align:center;margin:14px 0 0}
.by .edit{font-size:12px;font-weight:700;color:var(--ink);text-decoration:underline;text-underline-offset:2px;padding:2px 0}

.sec{text-align:left;margin:64px 0 22px;padding-top:22px;border-top:1px solid var(--line);display:flex;align-items:baseline;gap:10px}
.sec .en{font-size:11px;font-weight:700;letter-spacing:.2em;color:var(--muted)}
.sec h3{margin:0;font-size:16px;font-weight:800;color:var(--ink)}
.empty{text-align:center;color:var(--muted);padding:60px 0 90px;font-size:14px;border:1px dashed var(--line)}
.empty b{display:block;font-size:18px;font-weight:800;color:var(--ink);margin-bottom:6px}
main{padding-bottom:120px}
footer{border-top:1px solid var(--line);padding-block:26px;font-size:12px;color:var(--muted)}
footer .inner{display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px}
footer b{color:var(--ink);font-weight:800;letter-spacing:.02em}

/* 등록 패널 */
dialog{margin:0 0 0 auto;height:100%;max-height:100%;width:min(480px,100vw);max-width:100vw;border:0;padding:0;background:var(--bg);color:var(--fg);border-left:1px solid var(--line)}
dialog::backdrop{background:rgba(0,0,0,.4)}
form.reg{padding:calc(26px + env(safe-area-inset-top,0px)) max(26px,env(safe-area-inset-right,0px)) 30px 26px;display:flex;flex-direction:column;gap:20px;min-height:100%}
.reg .top{display:flex;justify-content:space-between;align-items:center;padding-bottom:16px;border-bottom:1px solid var(--line)}
.reg h3{margin:0;font-size:20px;font-weight:800;color:var(--ink)}
.reg .x{font-size:24px;line-height:1;color:var(--ink)}
.reg .hint{margin:-4px 0 0;color:var(--muted);font-size:13px}
.reg label{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:700;color:var(--ink)}
.reg input,.reg textarea{font:400 14px var(--font);color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:0;padding:11px 12px;width:100%;resize:vertical}
.reg input:focus,.reg textarea:focus{outline:none;border-color:var(--ink)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:460px){.row2{grid-template-columns:1fr}}
.drop{border:1px dashed var(--muted);padding:24px 12px;text-align:center;color:var(--muted);font-size:13px;font-weight:400;cursor:pointer;transition:border-color .15s,color .15s}
.drop.on,.drop:hover{border-color:var(--ink);color:var(--ink)}
.drop input{display:none}
.thumbs{display:flex;gap:6px;flex-wrap:wrap}
.thumbs img{width:58px;height:72px;object-fit:cover}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}
.seg button{border:1px solid var(--line);padding:10px 0;font-size:13px;font-weight:700;color:var(--muted)}
.seg button[aria-pressed="true"]{border-color:var(--ink);color:var(--ink);background:var(--tile)}
.err{color:var(--bad);font-size:13px;font-weight:700;margin:0}
.reg .actions{margin-top:auto;display:grid;grid-template-columns:1fr 2fr;gap:8px}
.reg .actions .btn{width:100%;text-align:center}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* ===== 모던 정리 (2026-11-04): 흑백 + 포인트 레드. 굵기 낮춤, 칸 없는 투표, 가는 선 ===== */
body{letter-spacing:-.005em}
.tabs button{font-weight:500}.tabs button[aria-selected="true"]{font-weight:600}
.tabs .n{color:var(--muted)}
.ph-head h2{font-weight:700}.ph-head .en{color:var(--muted);font-weight:500}
.ph-head .r .btn{background:transparent;color:var(--ink);border:1px solid var(--ink);font-weight:500}
.ph-head .r .btn:hover{background:var(--accbg2)}
.facts button{font-weight:400}.facts button b{font-weight:600}
.facts button[aria-pressed="true"]{border-color:var(--red)}
.name{font-weight:600;font-size:15px;letter-spacing:.01em}
.meta .mr{color:#6b6b6b;font-weight:400}
.status{color:var(--red);font-weight:500;letter-spacing:0}
.status.soon{color:var(--red);font-weight:700}
.status.soon::before{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--red);margin-right:6px;vertical-align:1px}
.status.done{color:var(--muted)}
.info{border-top:0;margin-top:18px;padding-top:0;font-size:12.5px;gap:5px 14px}
.info dd{font-weight:400}.info a{font-weight:500;text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:3px}
.score{margin-top:18px;padding-top:16px}
.score .avg{font-weight:300;font-size:32px;letter-spacing:-.02em}
.score .avg small{font-size:12px}
.score .st{font-weight:500;font-size:12px;color:var(--muted)}.score .st.ok{color:var(--ink)}
.bar{height:1px;margin-top:14px;background:#d8d8d8}
.bar i,.bar i.ok{top:-.5px;bottom:auto;height:2px;background:var(--ink)}
.bar .cut{width:2px;height:11px;top:-5px;background:var(--red)}
.bar-lab{font-size:10.5px;margin-top:6px}.bar-lab .c{color:var(--red);font-weight:600}
.vote{display:flex;justify-content:space-between;gap:0;margin-top:18px}
.vote button{border:0;width:30px;height:30px;padding:0;border-radius:50%;font-weight:500;color:var(--muted);display:grid;place-items:center;transition:background .15s,color .15s}
.vote button:hover{color:var(--ink);background:var(--accbg2);border:0}
.vote button[aria-pressed="true"]{background:var(--red);color:#fff;border:0}
.mine{font-size:12px}.mine b{color:var(--red)}
.who summary{font-weight:600}
.by{font-size:11.5px}
.result{border:0;padding:0;font-weight:600}
.result.pass,.result.fail{color:var(--ink)}
button.vw-sec.tg:hover{color:var(--ink)}
</style>

</head>
<body>
<style>
/* 로그인·승인대기·관리 화면 */
.auth{max-width:380px;margin:70px auto 120px;display:flex;flex-direction:column;gap:16px}
.auth h2{margin:0;font-size:22px;font-weight:800;color:var(--ink)}
.auth .sub{margin:-8px 0 6px;color:var(--muted);font-size:13px}
.auth label{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:700;color:var(--ink)}
.auth input{font:400 14px var(--font);color:var(--fg);background:var(--bg);border:1px solid var(--line);padding:11px 12px;width:100%}
.auth input:focus{outline:none;border-color:var(--ink)}
.auth .btn{width:100%;text-align:center}
.auth .switch{font-size:13px;color:var(--muted);text-align:center}
.auth .switch button{color:var(--ink);font-weight:700;border-bottom:1px solid var(--ink)}
.msg{font-size:13px;margin:0;font-weight:700}
.msg.err{color:var(--bad)}.msg.ok{color:var(--ok)}
.hd .right{display:flex;align-items:center;gap:16px;font-size:13px}
.hd .right .who{color:var(--fg);font-weight:700}
.hd .right button{color:var(--muted);font-size:12.5px;border-bottom:1px solid var(--line)}
.hd .right button:hover{color:var(--ink);border-color:var(--ink)}
.admin table{width:100%;border-collapse:collapse;font-size:13.5px}
.admin th,.admin td{text-align:left;padding:12px 8px;border-bottom:1px solid var(--line)}
.admin th{font-size:12px;color:var(--muted);font-weight:700}
.admin td .btn{padding:7px 14px;font-size:12.5px}
.admin .tw{overflow-x:auto}
.loading{padding:80px 0;text-align:center;color:var(--muted)}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;font-size:13px;font-weight:700;z-index:20;max-width:calc(100vw - 32px)}
[hidden]{display:none!important}
.pic img{cursor:zoom-in}
.linkrow{display:flex;gap:8px;align-items:flex-end}
.linkrow label{flex:1;min-width:0}
.linkrow .btn{padding:11px 14px;font-size:12.5px;white-space:nowrap}
.pick{display:grid;grid-template-columns:repeat(auto-fill,minmax(78px,1fr));gap:6px}
.pick button{position:relative;aspect-ratio:4/5;background:var(--tile);border:2px solid transparent;overflow:hidden;padding:0}
.pick button img{width:100%;height:100%;object-fit:cover;display:block}
.pick button[aria-pressed="true"]{border-color:var(--ink)}
.pick button[aria-pressed="true"]::after{content:"✓";position:absolute;top:4px;right:4px;background:var(--ink);color:var(--bg);font-size:11px;font-weight:800;width:18px;height:18px;display:grid;place-items:center}
.pickmsg{font-size:12.5px;color:var(--muted);margin:0}
.pickmsg.err{color:var(--bad);font-weight:700}
.getpic{margin-top:10px;width:100%;text-align:center;padding:9px 0;font-size:12.5px}
#pickDlg form{padding:24px;display:flex;flex-direction:column;gap:14px}
#pickDlg h3{margin:0;font-size:18px;font-weight:800;color:var(--ink)}
</style>
<style>
/* 설정창 · 포트폴리오 보기 */
.iconbtn{display:inline-flex;align-items:center;gap:6px}
.iconbtn svg{width:15px;height:15px}
#setDlg form{padding:26px;display:flex;flex-direction:column;gap:18px;min-width:min(360px,calc(100vw - 32px))}
#setDlg{margin:auto;height:auto;width:auto;border:1px solid var(--line)}
#setDlg h3{margin:0;font-size:18px;font-weight:800;color:var(--ink)}
#setDlg .lbl{font-size:13px;font-weight:700;color:var(--ink);margin-bottom:8px}
#setDlg .seg{grid-template-columns:repeat(2,1fr)}
#setDlg .seg.seg3{grid-template-columns:repeat(3,1fr)}
#setDlg .note{font-size:11.5px;color:var(--muted);margin:6px 0 0;line-height:1.5}

    <h2>${mode==="login"?T("login"):T("signup")}</h2>

    <label for="a-email">${T("email")}<input id="a-email" type="email" autocomplete="email" required></label>
    <label for="a-pw">${T("password")}<input id="a-pw" type="password" autocomplete="${mode==="login"?"current-password":"new-password"}" required minlength="6"></label>
    <p class="msg" id="aMsg" ${msg?"":"hidden"}>${esc(msg)}</p>
    <button class="btn" type="submit">${mode==="login"?T("doLogin"):T("doSignup")}</button>
    <p class="switch">${mode==="login"?`${T("firstTime")} <button type="button" id="aSwitch">${T("doSignup")}</button>`:`${T("haveAcct")} <button type="button" id="aSwitch">${T("doLogin")}</button>`}</p>
  </form>`;
  document.getElementById("aSwitch").onclick=()=>authView(mode==="login"?"signup":"login");
  const f=document.getElementById("authForm"),m=document.getElementById("aMsg");
  const say=(t,ok)=>{m.textContent=t;m.className="msg "+(ok?"ok":"err");m.hidden=false};
  f.onsubmit=async e=>{
    e.preventDefault();
    const email=document.getElementById("a-email").value.trim(),pw=document.getElementById("a-pw").value;
    if(!email||!pw)return say(T("needEmailPw"));
    const btn=f.querySelector("button[type=submit]");btn.disabled=true;
    if(mode==="login"){
      const {error}=await sb.auth.signInWithPassword({email,password:pw});
      btn.disabled=false;
      if(error)say(/confirm/i.test(error.message)?T("notConfirmed"):T("badLogin"));
    }else{
      const name=document.getElementById("a-name").value.trim();
      if(!name){btn.disabled=false;return say(T("needName"))}
      if(pw.length<6){btn.disabled=false;return say(T("pwShort"))}
      const {data,error}=await sb.auth.signUp({email,password:pw,options:{data:{display_name:name},emailRedirectTo:location.origin+location.pathname}});
      btn.disabled=false;
      if(error)return say(T("signupFail")+error.message);
      if(!data.session)authView("login",T("signupDone"));
    }
  };
}

const name=uid=>members.find(m=>m.id===uid)?.display_name||T("unknown");
const approvedMembers=()=>members.filter(m=>m.approved);
function vOf(cid){return votes.filter(v=>v.candidate_id===cid)}
function stats(it){const v=vOf(it.id).map(x=>x.score);const n=v.length;const avg=n?v.reduce((a,b)=>a+b,0)/n:0;return {n,avg,pct:avg/10}}
const deadline=it=>new Date(it.deadline).getTime();
const closed=it=>Date.now()>=deadline(it);
function passed(it){const s=stats(it);return s.n>0&&s.pct>=PASS}
function stageOf(it){if(it.withdrawn_at)return "withdrawn";if(!closed(it))return "cand";return passed(it)?"contact":"cand"}
function left(ms){if(ms<=0)return T("closedAt");const s=Math.floor(ms/1000),d=Math.floor(s/86400),h=Math.floor(s%86400/3600),m=Math.floor(s%3600/60),x=s%60,p=n=>String(n).padStart(2,"0");return (d?d+T("day"):"")+p(h)+":"+p(m)+":"+p(x)}

async function signPaths(paths){
  const need=[...new Set(paths)].filter(x=>!photoUrls[x]);
  if(!need.length)return;
  const {data}=await sb.storage.from(BUCKET).createSignedUrls(need,60*60*6);
  (data||[]).forEach(d=>{if(d.signedUrl)photoUrls[d.path]=d.signedUrl});
}

/* 카드 오른쪽 아래 치수: 177cm / BWH 33 - 24 - 35 / Shoes 250mm */
/* 신발 환산표: Nike 여성 신발 사이즈표 https://www.nike.com/size-fit/womens-footwear (CM/JP, US-W, US-M, EU) 2026-11-04 확인 */
const SHOE=[[21,4,2.5,34.5],[21.5,4.5,3,35],[22,5,3.5,35.5],[22.5,5.5,4,36],[23,6,4.5,36.5],[23.5,6.5,5,37.5],[24,7,5.5,38],[24.5,7.5,6,38.5],[25,8,6.5,39],[25.5,8.5,7,40],[26,9,7.5,40.5],[26.5,9.5,8,41],[27,10,8.5,42],[27.5,10.5,9,42.5],[28,11,9.5,43],[28.5,11.5,10,44],[29,12,10.5,44.5],[29.5,12.5,11,45],[30,13,11.5,45.5],[30.5,13.5,12,46],[31,14,12.5,47]];
const num=v=>{const m=/^\s*(\d+(?:\.\d+)?)\s*$/.exec(v||"");return m?+m[1]:null};
const r05=x=>Math.round(x*2)/2;
/* 쓰리사이즈: 50 미만은 인치, 50 이상은 cm로 입력된 것으로 봄 */
function threeVal(v){const n=num(v);if(n==null)return v;const isIn=n<50;
  if(U.three==="cm")return String(isIn?Math.round(n*2.54):n);
  return String(isIn?n:r05(n/2.54))}
/* 신발: 100 이상은 mm, 30~60은 EU, 그 밖은 US로 입력된 것으로 봄 (US는 남녀 구분이 없어 환산하지 않음) */
function shoeVal(v){const n=num(v);if(n==null)return v;
  let row=null,kind=n>=100?"mm":(n>=30&&n<=60?"eu":"us");
  if(kind==="mm"){const cm=n/10;row=SHOE.reduce((a,b)=>Math.abs(b[0]-cm)<Math.abs(a[0]-cm)?b:a);if(Math.abs(row[0]-cm)>0.5)row=null}
  else if(kind==="eu"){row=SHOE.find(r=>r[3]===n)||null}
  if(U.shoe==="mm")return kind==="mm"?n+"mm":row?Math.round(row[0]*10)+"mm":(kind==="eu"?"EU ":"US ")+n;
  if(U.shoe==="eu")return kind==="eu"?"EU "+n:row?"EU "+row[3]:(kind==="mm"?n+"mm":"US "+n);
  return kind==="us"?"US "+n:row?`US W${row[1]} · M${row[2]}`:(kind==="mm"?n+"mm":"EU "+n);
}
function sizeRows(it){
  const rows=[];
  if(it.height)rows.push(NA(it.height)?T("mHeight")+" "+T("naShort"):(/^\d{3}(\.\d+)?$/.test(it.height)?it.height+"cm":it.height));
  const b=[it.bust,it.waist,it.hips];
  if(b.some(Boolean))rows.push(b.every(NA)?T("sizeNA"):b.map(v=>v&&!NA(v)?threeVal(v):"–").join(" - "));
  if(it.shoe)rows.push("Shoes "+(NA(it.shoe)?T("naShort"):shoeVal(it.shoe)));
  return rows;
}

const viewer=document.getElementById("viewer"),vw=document.getElementById("vw");

/* 같은 사진 판별: Cloudflare Images 서명 주소는 서명·만료값이 바뀌어도 같은 사진 */
const mkey=u=>{u=u||"";const h=u.indexOf("#");if(h>=0){const k=new URLSearchParams(u.slice(h+1)).get("k");if(k)return "k:"+k;u=u.slice(0,h)}
  try{const x=new URL(u);return /(^|\.)imagedelivery\.net$/.test(x.hostname)?x.origin+x.pathname:u}catch(e){return u}};
/* 저장된 사진 문자열 풀기: "v:ID"(드라이브 영상), "x:주소#t=포스터"(바로 재생되는 영상), "큰사진#t=썸네일&k=고유키"(드롭박스) */
function parseItem(s){
  if(/^v:/.test(s)){const id=s.slice(2);return {s,u:dThumb(id),t:dThumb(id),vid:id}}
  if(/^h:/.test(s)){const h=s.indexOf("#");const po=h<0?"":(new URLSearchParams(s.slice(h+1)).get("t")||"");return {s,u:po,t:po,vsrc:decodeURIComponent(s.slice(2,h<0?undefined:h)),hls:true}}
  if(/^x:/.test(s)){const h=s.indexOf("#");const po=h<0?"":(new URLSearchParams(s.slice(h+1)).get("t")||"");const p2=/dropboxusercontent/.test(po)?"":po;   // 드롭박스 영상 포스터는 32px라 쓰지 않음
    return {s,u:p2,t:p2,vsrc:decodeURIComponent(s.slice(2,h<0?undefined:h))}}
  const h=s.indexOf("#");if(h<0)return {s,u:s,t:s};
  const q=new URLSearchParams(s.slice(h+1)),u=s.slice(0,h);return {s,u,t:q.get("t")||u};
}
const isDbx=u=>/(^|\.)dropbox\.com$/i.test((()=>{try{return new URL(u).hostname}catch(e){return ""}})());
const dbxFresh=new Set();
const isPf=u=>/(^|\.)picflow\.com$/i.test((()=>{try{return new URL(u).hostname}catch(e){return ""}})());
const isMs=u=>/(^|\.)mediaslide\.com$/i.test((()=>{try{return new URL(u).hostname}catch(e){return ""}})());
/* 링크에서 읽은 치수(키·가슴·허리·힙·신발) — 비어 있는 칸만 채움 */
const INFO_MAP={height:"f-height",bust:"f-bust",waist:"f-waist",hips:"f-hips",shoe:"f-shoe"};
const canEdit=it=>it&&(it.created_by===me.id||profile.role==="admin");
/* 포트폴리오 목록: 링크 사진(포트폴리오→스냅) + 직접 올린 사진. 메인 사진은 표시만 하고 따로 두지 않음 */
const isDrive=u=>/(^|\.)drive\.google\.com$/i.test((()=>{try{return new URL(u).hostname}catch(e){return ""}})());
const dThumb=id=>`https://drive.google.com/thumbnail?id=${encodeURIComponent(id)}&sz=w1600`;
function buildList(it,g,sn,fo){
  const remote=fo&&fo.length
    ?fo.flatMap((grp,gi)=>(grp.i||[]).map(x=>({...parseItem(x),k:"f"+gi,f:grp.n||""})))
    :g.map(u=>({...parseItem(u),k:"p"})).concat(sn.map(u=>({...parseItem(u),k:"s"})));
  const own=it.photos.map((path,i)=>({u:photoUrls[path],t:photoUrls[path],path,k:"p",own:true,i})).filter(x=>x.u);
  const uploads=own.filter(x=>!/\/link-/.test(x.path));
  const first=own.find(x=>x.i===0);
  let mainHit=null;
  if(first&&!/\/link-/.test(first.path))mainHit=first;
  else if(it.main_url){const k=mkey(it.main_url);mainHit=remote.find(x=>mkey(x.s||x.u)===k)||null}
  let lead=[];
  if(!mainHit&&first){lead=[first];mainHit=first}   // 예전에 등록된 후보: 메인 사진이 포트폴리오 안에서 확인되지 않으면 맨 앞에 한 장만 표시
  if(mainHit)mainHit.main=true;
  const ups=uploads.filter(x=>x!==lead[0]);
  if(fo&&fo.length)return lead.concat(ups.filter(x=>x.main),remote,ups.filter(x=>!x.main));
  return lead.concat(ups.filter(x=>x.main),remote.filter(x=>x.k==="p"),ups.filter(x=>!x.main),remote.filter(x=>x.k==="s"));
}
/* 링크 사진 주소가 만료됐거나(서명 주소) 사진이 거의 없으면 링크를 다시 읽음 */
function needRescan(it){
  if(!it.link||isMega(it.link))return false;
  if((isMs(it.link)||isPf(it.link))&&!it.folders?.length)return true;   // 앨범·영상 구조가 아직 없음   // mediaslide: 앨범·영상 구조가 아직 없음
  if(isDbx(it.link))return !dbxFresh.has(it.id)||!it.folders?.length;   // 드롭박스 사진 주소는 만료될 수 있어 세션마다 1번 다시 읽음
  if(isDrive(it.link)&&/\/folders\//.test(it.link))return !it.folders?.length;   // 웹하드: 폴더 구조가 없을 때만 다시 읽음 (드라이브 주소는 만료 없음)
  const g=it.gallery||[],sn=it.snaps||[];
  if(!g.length&&!sn.length)return true;
  if(g.length<=2)return true;
  const soon=Date.now()+10*60*1000;
  return g.concat(sn).some(u=>{const m=/[?&]exp=(\d{9,})/.exec(u);return m&&+m[1]*1000<soon});
}

  const vc=k=>vList.filter(x=>x.k===k&&x.vid).length;
  const seq={};
  const grid=vList.map((x,i)=>{const l=secLab(x,i),closed=fold(x)&&!vOpen.has(x.k),no=String(seq[x.k]=(seq[x.k]||0)+1).padStart(2,"0");
    const head=l?(fold(x)?`<button type="button" class="vw-sec tg" data-g="${x.k}" aria-expanded="${!closed}"><i aria-hidden="true"></i>${esc(l)}<span>${cnt(x.k)}${vc(x.k)?` · ${T("videoN",{n:vc(x.k)})}`:""}</span></button>`:`<div class="vw-sec">${esc(l)}<span>${cnt(x.k)}</span></div>`):"";
    return `${head}<button type="button" data-k="${i}" data-gk="${x.k}" class="${x.main?"main":""}${x.vid||x.vsrc?" vid":""}" aria-current="${i===vIdx}" ${closed?"hidden":""}><span class="im">${x.t?`<img src="${esc(x.t)}" alt="${i+1}" loading="lazy" referrerpolicy="no-referrer">`:`<span class="vw-vtile" aria-hidden="true">VIDEO</span>`}${x.vid||x.vsrc?`<span class="vw-play" aria-hidden="true"></span>`:""}</span><span class="cp"><b>${no}</b>${x.main?"<span>Main</span>":""}</span></button>`}).join("");
  const who=[NA(it.nationality)?T("mNat")+" "+T("naShort"):it.nationality,NA(it.age)?T("mAge")+" "+T("naShort"):it.age?it.age+T("ageUnit"):""].filter(Boolean);
  const meas=sizeRows(it);
  const facts=who.length||meas.length?`<div class="vw-facts">${who.length?`<div class="g">${who.map(x=>`<span>${esc(x)}</span>`).join("")}</div>`:""}${who.length&&meas.length?`<i aria-hidden="true"></i>`:""}${meas.length?`<div class="g m">${meas.map(x=>`<span>${esc(x)}</span>`).join("")}</div>`:""}</div>`:"";
  vw.innerHTML=`<div class="vw-top"><div class="t"><div class="nm"><b>${esc(it.name)}</b>${it.agency?`<span class="ag">${esc(it.agency)}</span>`:""}</div>${facts}</div>
    <div class="acts">${it.link?`<a href="${esc(it.link)}" target="_blank" rel="noopener">${T("vwOpen")}</a>`:""}<button class="x" id="vwClose" aria-label="${T("close")}">×</button></div></div>
    <div class="vw-body" id="vwBody" style="--pw:${VS.pw}px;--ph:${VS.ph}px">
      <div class="vw-main" id="vwMain">${n?`<img class="vw-peek" id="vwPeekP" alt="" referrerpolicy="no-referrer"><img class="vw-peek" id="vwPeekN" alt="" referrerpolicy="no-referrer"><img id="vwImg" alt="${esc(it.name)}" referrerpolicy="no-referrer"><div class="vw-video" id="vwVideo" hidden></div>${n>1?`<button class="vw-nav prev" id="vwPrev" aria-label="prev">‹</button><button class="vw-nav next" id="vwNext" aria-label="next">›</button><span class="vw-count" id="vwCount"></span>`:""}<div class="vw-zoom"><button type="button" id="zOut" aria-label="${T("zOut")}">−</button><button type="button" id="zFit" aria-label="${T("zFit")}">${T("zFit")}</button><button type="button" id="zIn" aria-label="${T("zIn")}">+</button></div>`:""}
        <p class="vw-msg" id="vwMsg" ${n?"hidden":""}>${n?"":T("vwNone")}</p></div>
      <div class="vw-split" id="vwSplit" role="separator" aria-orientation="${narrow()?"horizontal":"vertical"}" tabindex="0" aria-label="resize"><i></i></div>
      <div class="vw-panel">
        <div class="vw-ph">${canEdit(it)&&n?`<button type="button" class="setmain" id="vwSetMain" hidden>${T("setMain")}</button>`:""}<div class="vw-sz" id="vwSz"><button type="button" id="szDn" aria-label="${T("zOut")}">−</button><input type="range" id="vwSize" min="60" max="360" step="2" value="${VS.ts}" aria-label="${T("thumbSize")}"><button type="button" id="szUp" aria-label="${T("zIn")}">+</button></div></div>
        <div class="vw-grid" id="vwGrid" style="--ts:${VS.ts}px">${grid}</div>
      </div>
    </div>`;
  document.getElementById("vwClose").onclick=()=>viewer.close();
  const p=document.getElementById("vwPrev"),nx=document.getElementById("vwNext");
  if(p)p.onclick=()=>go(-1);if(nx)nx.onclick=()=>go(1);
  const gridEl=document.getElementById("vwGrid");
  gridEl.querySelectorAll("[data-k]").forEach(b=>{b.onclick=()=>{vIdx=+b.dataset.k;showCurrent()};const im=b.querySelector("img");if(im)im.onerror=()=>dropBroken(+b.dataset.k)});
  const size=document.getElementById("vwSize");
  // 열 수 = 패널 폭 ÷ 원하는 사진 폭, 사진 높이 = 실제 열 폭 × 1.25 (4:5)
  const layout=()=>{const cs=getComputedStyle(gridEl),w=gridEl.clientWidth-parseFloat(cs.paddingLeft)-parseFloat(cs.paddingRight),gap=6;
    if(w<=0)return;const cols=Math.max(1,Math.floor((w+gap)/(VS.ts+gap)));const cw=(w-gap*(cols-1))/cols;
    gridEl.style.setProperty("--cols",cols);gridEl.style.setProperty("--th",Math.round(cw*1.25)+"px");gridEl.dataset.cols=cols};
  layoutGrid=layout;
  if(window.ResizeObserver){new ResizeObserver(layout).observe(gridEl)}
  layout();
  const setTs=v=>{VS.ts=Math.min(360,Math.max(60,Math.round(v)));size.value=VS.ts;layout();saveVS()};
  size.oninput=()=>{VS.ts=+size.value;layout()};size.onchange=saveVS;
  document.getElementById("szDn").onclick=()=>setTs(VS.ts-20);
  document.getElementById("szUp").onclick=()=>setTs(VS.ts+20);
  // 슬라이더 위에서 마우스 휠로 조절, 사진 영역은 Ctrl+휠로 조절 (캡쳐원처럼)
  document.getElementById("vwSz").addEventListener("wheel",e=>{e.preventDefault();setTs(VS.ts-Math.sign(e.deltaY||-e.deltaX)*10)},{passive:false});
  gridEl.addEventListener("wheel",e=>{if(!e.ctrlKey)return;e.preventDefault();setTs(VS.ts-Math.sign(e.deltaY)*10)},{passive:false});
  const sm=document.getElementById("vwSetMain");if(sm)sm.onclick=setMain;
  gridEl.querySelectorAll("[data-g]").forEach(h=>h.onclick=()=>{const k=h.dataset.g,open=!vOpen.has(k);if(open)vOpen.add(k);else vOpen.delete(k);
    h.setAttribute("aria-expanded",open);gridEl.querySelectorAll(`[data-gk="${k}"]`).forEach(b=>b.hidden=!open)});
  setupSplit();setupZoom();showCurrent();
}
function dropBroken(k){
  if(!vList[k]||vList[k].own||vList[k].main)return;
  vList.splice(k,1);if(vIdx>=vList.length)vIdx=Math.max(0,vList.length-1);
  if(vIdx>k)vIdx--;
  drawViewer();
}
function showCurrent(){
  const cur=vList[vIdx],img=document.getElementById("vwImg");if(!cur||!img)return;
  img.onerror=()=>dropBroken(vIdx);
  if(cur.u)img.src=cur.u;img.alt=`${vIt?.name||""} ${vIdx+1}`;
  // 영상: 구글 드라이브 재생 화면을 큰 사진 자리에 띄움
  const vb=document.getElementById("vwVideo");
  if(vb){if(cur.vid||cur.vsrc){stopHls();vb.innerHTML=cur.vid?`<iframe src="https://drive.google.com/file/d/${encodeURIComponent(cur.vid)}/preview" allow="autoplay; fullscreen" allowfullscreen title="video"></iframe>`:(cur.hls?`<video controls playsinline preload="metadata"${cur.u?` poster="${esc(cur.u)}"`:""}></video>`:`<video src="${esc(cur.vsrc)}" controls playsinline preload="metadata"></video>`);vb.hidden=false;img.hidden=true;
      if(cur.hls)playHls(vb.querySelector("video"),cur.vsrc)}
    else{if(!vb.hidden){stopHls();vb.innerHTML="";vb.hidden=true}img.hidden=false}}
  const c=document.getElementById("vwCount");if(c)c.textContent=`${String(vIdx+1).padStart(2,"0")} / ${String(vList.length).padStart(2,"0")}${cur.main?" — Main":""}`;
  const sm=document.getElementById("vwSetMain");if(sm)sm.hidden=!!cur.main||!!cur.vid||!!cur.vsrc;
  document.querySelectorAll("#vwGrid [data-k]").forEach(b=>b.setAttribute("aria-current",+b.dataset.k===vIdx));
  const act=document.querySelector('#vwGrid [aria-current="true"]');if(act)act.scrollIntoView({block:"nearest",inline:"nearest"});
  resetZoom&&resetZoom();
}
/* HLS(.m3u8) 영상: 사파리·아이폰은 바로 재생, 그 밖에는 hls.js를 처음 한 번만 불러와 재생 */
let hlsLib=null;
const stopHls=()=>{if(window.__hls){try{window.__hls.destroy()}catch(e){}window.__hls=null}};
function playHls(v,src){if(!v)return;stopHls();
  if(v.canPlayType("application/vnd.apple.mpegurl")&&/iPhone|iPad|Safari/.test(navigator.userAgent)&&!/Chrome|Android/.test(navigator.userAgent)){v.src=src;return}
  hlsLib=hlsLib||new Promise((ok,no)=>{const sc=document.createElement("script");sc.src="https://cdn.jsdelivr.net/npm/hls.js@1.5.20/dist/hls.min.js";sc.onload=()=>ok(window.Hls);sc.onerror=no;document.head.appendChild(sc)});
  hlsLib.then(H=>{if(!v.isConnected)return;if(H&&H.isSupported()){const h=new H();window.__hls=h;h.loadSource(src);h.attachMedia(v)}else v.src=src}).catch(()=>{v.src=src})}
function go(d){if(!vList.length)return;vIdx=(vIdx+d+vList.length)%vList.length;showCurrent()}
/* 패널 경계 끌어서 폭(폰은 높이) 조절 */
function setupSplit(){
  const sp=document.getElementById("vwSplit"),body=document.getElementById("vwBody");if(!sp)return;
  let st=null;
  sp.addEventListener("pointerdown",e=>{sp.setPointerCapture(e.pointerId);st={x:e.clientX,y:e.clientY,pw:VS.pw,ph:VS.ph};body.classList.add("resizing")});
  sp.addEventListener("pointermove",e=>{if(!st)return;const r=body.getBoundingClientRect();
    if(narrow()){VS.ph=Math.round(Math.min(r.height-120,Math.max(110,st.ph-(e.clientY-st.y))));body.style.setProperty("--ph",VS.ph+"px")}
    else{VS.pw=Math.round(Math.min(r.width-240,Math.max(180,st.pw-(e.clientX-st.x))));body.style.setProperty("--pw",VS.pw+"px")}});
  const done=()=>{if(st){st=null;body.classList.remove("resizing");saveVS();resetZoom&&resetZoom()}};
  sp.addEventListener("pointerup",done);sp.addEventListener("pointercancel",done);
  sp.addEventListener("keydown",e=>{const k=e.key;let d=0;if(k==="ArrowLeft"||k==="ArrowUp")d=20;else if(k==="ArrowRight"||k==="ArrowDown")d=-20;else return;e.preventDefault();e.stopPropagation();
    if(narrow()){VS.ph=Math.max(110,VS.ph+d);body.style.setProperty("--ph",VS.ph+"px")}else{VS.pw=Math.max(180,VS.pw+d);body.style.setProperty("--pw",VS.pw+"px")}saveVS()});
}
/* 확대·축소: 마우스 휠, 두 손가락 벌리기, 두 번 누르기, +/− 버튼. 확대 중에는 끌어서 이동 */
let Z={s:1,x:0,y:0},resetZoom=null,layoutGrid=null;
function setupZoom(){
  const main=document.getElementById("vwMain");
  Z={s:1,x:0,y:0};
  if(!main||!document.getElementById("vwImg"))return;
  const img=()=>document.getElementById("vwImg");
  const MAX=6;
  const rect=()=>main.getBoundingClientRect();
  const apply=()=>{const r=rect();if(Z.s<=1.001){Z={s:1,x:0,y:0}}else{Z.x=Math.min(0,Math.max(r.width-r.width*Z.s,Z.x));Z.y=Math.min(0,Math.max(r.height-r.height*Z.s,Z.y))}
    img().style.transform=`translate(${Z.x}px,${Z.y}px) scale(${Z.s})`;main.classList.toggle("zoomed",Z.s>1)};
  resetZoom=()=>{Z={s:1,x:0,y:0};apply()};
  const zoomAt=(ns,px,py)=>{ns=Math.min(MAX,Math.max(1,ns));Z.x=px-(px-Z.x)*(ns/Z.s);Z.y=py-(py-Z.y)*(ns/Z.s);Z.s=ns;apply()};
  const center=()=>{const r=rect();return [r.width/2,r.height/2]};
  window.__vwZoom=()=>({...Z});
  main.addEventListener("wheel",e=>{e.preventDefault();const r=rect();zoomAt(Z.s*Math.exp(-e.deltaY*0.0015),e.clientX-r.left,e.clientY-r.top)},{passive:false});
  document.getElementById("zIn").onclick=()=>{const [cx,cy]=center();zoomAt(Z.s*1.5,cx,cy)};
  document.getElementById("zOut").onclick=()=>{const [cx,cy]=center();zoomAt(Z.s/1.5,cx,cy)};
  document.getElementById("zFit").onclick=()=>resetZoom();
  const pts=new Map();let start=null,pinch=null,lastTap=0,sw=null;
  const peekP=document.getElementById("vwPeekP"),peekN=document.getElementById("vwPeekN");
  const at=(i)=>vList[(i+vList.length)%vList.length];
  const setX=(dx,anim)=>{const W=rect().width,t=anim?"transform .24s cubic-bezier(.2,.7,.2,1)":"none";
    img().style.transition=t;peekP.style.transition=t;peekN.style.transition=t;
    img().style.transform=`translateX(${dx}px)`;peekP.style.transform=`translateX(${dx-W}px)`;peekN.style.transform=`translateX(${dx+W}px)`};
  const swipeStart=()=>{if(vList.length<2)return false;const p=at(vIdx-1),n=at(vIdx+1);
    peekP.src=p.u||p.t||"";peekN.src=n.u||n.t||"";main.classList.add("swiping");return true};
  const swipeEnd=(dx,vx)=>{const W=rect().width;const d=(dx<-W*0.18||vx<-0.45)?1:(dx>W*0.18||vx>0.45)?-1:0;
    setX(d?-d*W:0,true);
    setTimeout(()=>{main.classList.remove("swiping");img().style.transition="none";peekP.style.transition="none";peekN.style.transition="none";
      if(d){const nx=at(vIdx+d);if(nx.u)img().src=nx.u;go(d)}img().style.transform="";peekP.style.transform="";peekN.style.transform=""},250)};
  main.addEventListener("pointerdown",e=>{
    if(e.target.closest("button"))return;
    main.setPointerCapture(e.pointerId);pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
    if(pts.size===1){start={x:e.clientX,y:e.clientY,zx:Z.x,zy:Z.y,t:Date.now()};main.classList.add("drag");sw=(e.pointerType==="touch"&&Z.s<=1)?{on:false,lx:e.clientX,lt:Date.now(),vx:0}:null}
    if(pts.size===2&&sw){if(sw.on){setX(0,false);main.classList.remove("swiping")}sw=null}
    if(pts.size===2){const [a,b]=[...pts.values()];const r=rect();pinch={d:Math.hypot(a.x-b.x,a.y-b.y),s:Z.s,mx:(a.x+b.x)/2-r.left,my:(a.y+b.y)/2-r.top,zx:Z.x,zy:Z.y};start=null}
  });
  main.addEventListener("pointermove",e=>{
    if(!pts.has(e.pointerId))return;pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
    if(pinch&&pts.size>=2){const [a,b]=[...pts.values()];const r=rect();const d=Math.hypot(a.x-b.x,a.y-b.y),mx=(a.x+b.x)/2-r.left,my=(a.y+b.y)/2-r.top;
      const ns=Math.min(MAX,Math.max(1,pinch.s*d/pinch.d));
      Z.s=ns;Z.x=mx-(pinch.mx-pinch.zx)*(ns/pinch.s);Z.y=my-(pinch.my-pinch.zy)*(ns/pinch.s);apply();return}
    if(start&&Z.s>1){Z.x=start.zx+(e.clientX-start.x);Z.y=start.zy+(e.clientY-start.y);apply();return}
    if(start&&sw&&pts.size===1){const dx=e.clientX-start.x,dy=e.clientY-start.y;
      if(!sw.on&&Math.abs(dx)>8&&Math.abs(dx)>Math.abs(dy))sw.on=swipeStart();
      if(sw.on){const now=Date.now();sw.vx=(e.clientX-sw.lx)/Math.max(1,now-sw.lt);sw.lx=e.clientX;sw.lt=now;setX(dx,false)}}
  });
  const end=e=>{
    if(!pts.has(e.pointerId))return;pts.delete(e.pointerId);
    if(pts.size<2)pinch=null;
    if(pts.size===0){
      main.classList.remove("drag");
      if(start){
        const dx=e.clientX-start.x,dy=e.clientY-start.y,moved=Math.hypot(dx,dy);
        if(sw&&sw.on)swipeEnd(dx,sw.vx);
        else if(Z.s<=1&&Math.abs(dx)>50&&Math.abs(dx)>Math.abs(dy))go(dx<0?1:-1);
        else if(moved<8){const now=Date.now();const r=rect();if(now-lastTap<300){if(Z.s>1)resetZoom();else zoomAt(2.5,e.clientX-r.left,e.clientY-r.top);lastTap=0}else lastTap=now}
      }
      start=null;sw=null;
    }else if(pts.size===1){const [a]=[...pts.values()];start={x:a.x,y:a.y,zx:Z.x,zy:Z.y,t:Date.now()}}
  };
  main.addEventListener("pointerup",end);main.addEventListener("pointercancel",end);
  apply();
}
/* 방향키: 그리드에서 사진을 고른 뒤에는 위·아래·옆 사진으로 선택 이동 (스크롤 대신). 그 밖에는 ←/→로 앞뒤 사진 */
function gridMove(key){
  const tiles=[...document.querySelectorAll("#vwGrid [data-k]")].filter(b=>!b.hidden);
  const cur=tiles.find(b=>+b.dataset.k===vIdx)||document.activeElement?.closest?.("#vwGrid [data-k]");if(!cur)return false;
  const i=tiles.indexOf(cur);let nx=null;
  if(key==="ArrowRight")nx=tiles[i+1];else if(key==="ArrowLeft")nx=tiles[i-1];
  else{const r=cur.getBoundingClientRect(),cx=r.left+r.width/2,up=key==="ArrowUp";
    const rows=tiles.filter(b=>{const q=b.getBoundingClientRect();return up?q.bottom<=r.top+2:q.top>=r.bottom-2});
    if(rows.length){const edge=up?Math.max(...rows.map(b=>b.getBoundingClientRect().top)):Math.min(...rows.map(b=>b.getBoundingClientRect().top));
      const row=rows.filter(b=>Math.abs(b.getBoundingClientRect().top-edge)<4);
      nx=row.reduce((a,b)=>{const da=Math.abs(a.getBoundingClientRect().left+a.getBoundingClientRect().width/2-cx),db=Math.abs(b.getBoundingClientRect().left+b.getBoundingClientRect().width/2-cx);return db<da?b:a})}}
  if(!nx)return true;
  vIdx=+nx.dataset.k;showCurrent();nx.focus({preventScroll:true});nx.scrollIntoView({block:"nearest"});return true;
}
document.addEventListener("keydown",e=>{if(!viewer.open||e.target.closest?.("input,#vwSplit"))return;
  if(!/^Arrow(Up|Down|Left|Right)$/.test(e.key))return;
  if(e.target.closest?.("#vwGrid")){e.preventDefault();gridMove(e.key);return}
  if(e.key==="ArrowRight"){e.preventDefault();go(1)}else if(e.key==="ArrowLeft"){e.preventDefault();go(-1)}});
viewer.addEventListener("close",()=>{vIt=null});

/* ---------- 시작 ---------- */
staticText();
async function boot(session){
  me=session?.user||null;
  if(!me){if(channel){sb.removeChannel(channel);channel=null}return authView()}
  const {data,error}=await sb.from("profiles").select("*").eq("id",me.id).maybeSingle();
  if(error){root.innerHTML=`<div class="empty"><b>${T("infoFail")}</b>${esc(error.message)}</div>`;return}
  profile=data;
  if(!profile?.approved)return pendingView();
  root.innerHTML=`<div class="loading">${T("loading")}</div>`;
  try{await loadAll()}catch(e){root.innerHTML=`<div class="empty"><b>${T("dataFail")}</b>${esc(e.message)}</div>`;return}
  subscribe();render();autoFill();
}
/* 링크만 있고 사진이 없는 내 후보(관리자는 전체)는 메인 사진·포트폴리오를 자동으로 채움 — 세션당 1회 */
const autoTried=new Set();
async function autoFill(){
  const targets=items.filter(it=>!it.withdrawn_at&&it.link&&!isMega(it.link)&&!it.photos.length&&!autoTried.has(it.id)&&(it.created_by===me.id||profile.role==="admin"));
  for(const it of targets){
    autoTried.add(it.id);
    try{
      const r=await scanLink(it.link);
      if(!r.suggested)continue;
      const im=await importImages([r.suggested],r.url||it.link);
      const patch={};
      if(im.paths.length){patch.photos=im.paths;patch.main_url=r.suggested}
      if(!it.gallery?.length&&r.gallery?.length)patch.gallery=r.gallery.slice(0,200);
      if(!it.snaps?.length&&r.snaps?.length)patch.snaps=r.snaps.slice(0,200);
      if(!it.folders&&r.folders?.length)patch.folders=r.folders;
      for(const k of Object.keys(INFO_MAP))if(r.info?.[k]&&!it[k])patch[k]=String(r.info[k]).slice(0,20);
      if(Object.keys(patch).length)await sb.from("candidates").update(patch).eq("id",it.id);
    }catch(e){console.warn("autofill",it.id,e.message)}
  }
  if(targets.length){try{await loadAll();if(tab!=="admin")render()}catch(e){}}
}
let lastUid;
sb.auth.onAuthStateChange((ev,session)=>{
  const uid=session?.user?.id||null;
  if(ev==="TOKEN_REFRESHED"&&uid===lastUid)return;
  lastUid=uid;setTimeout(()=>boot(session),0);
});
})();
</script>
