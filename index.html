<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>MDI 부킹 보드</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nanum+Gothic:wght@400;700;800&display=swap">
<style>
/* Layout: 모델 에이전시 사이트형. 흰 고정 헤더(굵은 대문자 워드마크) · 가운데 단계 탭 · 큰 세로 사진 + 가운데 대문자 이름 + 'Label - value' 정보줄 */
:root{
  --bg:#ffffff; --fg:#1b1b1b; --ink:#000000; --muted:#767676; --line:#e5e5e5; --tile:#f3f3f3;
  --pink:#d9609a; --ok:#1f7a4d; --bad:#c0392b;
  --font:"Nanum Gothic","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#101010; --fg:#ececec; --ink:#ffffff; --muted:#9a9a9a; --line:#2a2a2a; --tile:#1b1b1b;
  --pink:#f08cbb; --ok:#5fc48f; --bad:#ff7a6b; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#101010; --fg:#ececec; --ink:#ffffff; --muted:#9a9a9a; --line:#2a2a2a; --tile:#1b1b1b;
  --pink:#f08cbb; --ok:#5fc48f; --bad:#ff7a6b; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:14px;line-height:1.65;margin:0;-webkit-font-smoothing:antialiased;word-break:keep-all}
p,h2,h3{text-wrap:pretty}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible,summary:focus-visible,a:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.gut{padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}
.inner{max-width:1240px;margin:0 auto}

/* 헤더 */
.hd{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.hd .inner{display:flex;justify-content:space-between;align-items:center;gap:16px;height:60px}
.mark{margin:0;font-weight:800;font-size:21px;letter-spacing:-.01em;color:var(--ink);text-transform:uppercase;white-space:nowrap;line-height:1}
.mark span{font-weight:400;font-size:12px;letter-spacing:.14em;color:var(--muted);margin-left:8px;vertical-align:3px}
.me{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--muted)}
.me select{font:700 13px var(--font);color:var(--ink);background:transparent;border:1px solid var(--line);padding:6px 8px;cursor:pointer}

.notice{font-size:12.5px;color:var(--muted);text-align:center;padding-block:10px;border-bottom:1px solid var(--line);margin:0}
.notice b{color:var(--pink);font-weight:700}

/* 단계 탭 */
.tabs{display:flex;gap:30px;padding-block:18px 0;overflow-x:auto;scrollbar-width:none;border-bottom:1px solid var(--line)}
.tabs::-webkit-scrollbar{display:none}
.tabs button{font-size:14px;font-weight:700;color:var(--muted);letter-spacing:.01em;white-space:nowrap;padding-bottom:10px;margin-bottom:-1px;border-bottom:2px solid transparent}
.tabs button:hover{color:var(--ink)}
.tabs button[aria-selected="true"]{color:var(--ink);border-color:var(--ink)}
.tabs .n{font-weight:400;font-size:12px;margin-left:5px;color:var(--pink)}
@media (max-width:640px){.tabs{gap:22px}}

/* 페이지 머리: 왼쪽 제목·설명·요약, 오른쪽 버튼 */
.ph-head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px 24px;flex-wrap:wrap;padding:22px 0 24px}
.ph-head .l{min-width:0;flex:1 1 360px}
.ph-head h2{margin:0;font-size:20px;font-weight:800;letter-spacing:-.01em;color:var(--ink);line-height:1.3;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.ph-head .en{font-size:11px;font-weight:700;letter-spacing:.2em;color:var(--pink)}
.ph-head p{margin:4px 0 0;color:var(--muted);font-size:13px}
.facts{display:flex;flex-wrap:wrap;gap:4px 20px;margin-top:8px;font-size:13px;color:var(--muted)}
.facts b{color:var(--ink);font-weight:800;margin-left:5px;font-variant-numeric:tabular-nums}
.ph-head .r{flex:none}
.ph-head .r .btn{padding:11px 22px}
@media (max-width:640px){.ph-head{position:relative}.ph-head .r{position:absolute;top:18px;right:0}.ph-head .r .btn{padding:8px 14px;font-size:12.5px}.ph-head h2{padding-right:110px}}
.btn{display:inline-block;background:var(--ink);color:var(--bg);font-weight:700;font-size:13.5px;letter-spacing:.04em;padding:13px 34px;border:1px solid var(--ink);transition:opacity .15s}
.btn:hover{opacity:.82}
.btn.line{background:transparent;color:var(--ink)}

/* 그리드 */
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:56px 28px}
@media (max-width:1100px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:780px){.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:44px 14px}}
@media (max-width:460px){.grid{grid-template-columns:minmax(0,1fr)}}
.card{display:flex;flex-direction:column;min-width:0}
.pic{position:relative;aspect-ratio:4/5;max-width:100%;background:var(--tile);overflow:hidden}
.pic .strip{position:absolute;inset:0;display:flex;gap:1px}
.pic img{flex:1;min-width:0;width:100%;height:100%;object-fit:cover}
.noimg{position:absolute;inset:0;display:grid;place-items:center;text-align:center;color:var(--muted);font-size:12.5px}
.noimg b{display:block;font-weight:800;font-size:60px;color:var(--ink);opacity:.12;line-height:1;margin-bottom:12px}
.ex{position:absolute;top:10px;left:10px;background:var(--bg);color:var(--ink);font-size:11px;font-weight:700;padding:3px 8px;letter-spacing:.06em}

.name{margin:16px 0 0;text-align:center;font-weight:800;font-size:15.5px;letter-spacing:.02em;text-transform:uppercase;color:var(--ink);line-height:1.35}
.status{text-align:center;font-size:12.5px;font-weight:700;margin:3px 0 0;font-variant-numeric:tabular-nums;color:var(--pink);letter-spacing:.03em}
.status.soon{color:var(--bad)}
.status.done{color:var(--muted)}
.info{list-style:none;margin:14px 0 0;padding:12px 0 0;border-top:1px solid var(--line);display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:13px}
.info dt{color:var(--muted)}
.info dd{margin:0;color:var(--fg);text-align:right;word-break:break-all}
.info a{color:var(--ink);font-weight:700}

.score{margin-top:16px;padding-top:14px;border-top:1px solid var(--line)}
.score .top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.score .avg{font-size:26px;font-weight:800;color:var(--ink);line-height:1;font-variant-numeric:tabular-nums}
.score .avg small{font-size:13px;font-weight:400;color:var(--muted);margin-left:3px}
.score .st{font-size:12.5px;font-weight:700;color:var(--muted)}
.score .st.ok{color:var(--ok)}
.bar{position:relative;height:4px;background:var(--line);margin-top:10px}
.bar i{position:absolute;left:0;top:0;bottom:0;background:var(--ink)}
.bar i.ok{background:var(--ok)}
.bar .cut{position:absolute;left:60%;top:-4px;height:12px;width:2px;background:var(--pink)}
.bar-lab{display:flex;justify-content:space-between;font-size:11.5px;color:var(--muted);margin-top:4px;position:relative}
.bar-lab .c{position:absolute;left:60%;transform:translateX(-50%);color:var(--pink);font-weight:700}

.vote{display:grid;grid-template-columns:repeat(10,1fr);gap:4px;margin-top:16px}
.vote button{border:1px solid var(--line);padding:8px 0;font-size:13px;font-weight:700;color:var(--fg);font-variant-numeric:tabular-nums;transition:border-color .12s,background .12s,color .12s}
.vote button:hover{border-color:var(--ink)}
.vote button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.mine{font-size:12.5px;color:var(--muted);text-align:center;margin:8px 0 0}
.mine b{color:var(--ink)}

.result{margin-top:16px;padding:11px 14px;display:flex;justify-content:space-between;font-size:13.5px;font-weight:800;border:1px solid currentColor}
.result.pass{color:var(--ok)}
.result.fail{color:var(--bad)}

.who{margin-top:14px;border-top:1px solid var(--line)}
.who summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;align-items:center;padding:11px 0 4px;font-size:13px;font-weight:700;color:var(--ink)}
.who summary::-webkit-details-marker{display:none}
.who summary .c{font-weight:400;color:var(--muted);margin-left:6px}
.who summary .pm{font-size:18px;font-weight:400;line-height:1}
.who summary .pm::before{content:"+"}
.who[open] summary .pm::before{content:"−"}
.who dl{margin:6px 0 0;display:grid;grid-template-columns:1fr auto;gap:5px 10px;font-size:13px}
.who dt{color:var(--fg)}
.who dd{margin:0;font-weight:800;color:var(--ink);font-variant-numeric:tabular-nums}
.who .no{color:var(--muted);font-weight:400}
.by{font-size:12px;color:var(--muted);text-align:center;margin:14px 0 0}

.sec{text-align:left;margin:64px 0 22px;padding-top:22px;border-top:1px solid var(--line);display:flex;align-items:baseline;gap:10px}
.sec .en{font-size:11px;font-weight:700;letter-spacing:.2em;color:var(--muted)}
.sec h3{margin:0;font-size:16px;font-weight:800;color:var(--ink)}
.empty{text-align:center;color:var(--muted);padding:60px 0 90px;font-size:14px;border:1px dashed var(--line)}
.empty b{display:block;font-size:18px;font-weight:800;color:var(--ink);margin-bottom:6px}
main{padding-bottom:120px}
footer{border-top:1px solid var(--line);padding-block:26px;font-size:12px;color:var(--muted)}
footer .inner{display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px}
footer b{color:var(--ink);font-weight:800;letter-spacing:.02em}

/* 등록 패널 */
dialog{margin:0 0 0 auto;height:100%;max-height:100%;width:min(480px,100vw);max-width:100vw;border:0;padding:0;background:var(--bg);color:var(--fg);border-left:1px solid var(--line)}
dialog::backdrop{background:rgba(0,0,0,.4)}
form.reg{padding:calc(26px + env(safe-area-inset-top,0px)) max(26px,env(safe-area-inset-right,0px)) 30px 26px;display:flex;flex-direction:column;gap:20px;min-height:100%}
.reg .top{display:flex;justify-content:space-between;align-items:center;padding-bottom:16px;border-bottom:1px solid var(--line)}
.reg h3{margin:0;font-size:20px;font-weight:800;color:var(--ink)}
.reg .x{font-size:24px;line-height:1;color:var(--ink)}
.reg .hint{margin:-4px 0 0;color:var(--muted);font-size:13px}
.reg label{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:700;color:var(--ink)}
.reg input,.reg textarea{font:400 14px var(--font);color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:0;padding:11px 12px;width:100%;resize:vertical}
.reg input:focus,.reg textarea:focus{outline:none;border-color:var(--ink)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:460px){.row2{grid-template-columns:1fr}}
.drop{border:1px dashed var(--muted);padding:24px 12px;text-align:center;color:var(--muted);font-size:13px;font-weight:400;cursor:pointer;transition:border-color .15s,color .15s}
.drop.on,.drop:hover{border-color:var(--ink);color:var(--ink)}
.drop input{display:none}
.thumbs{display:flex;gap:6px;flex-wrap:wrap}
.thumbs img{width:58px;height:72px;object-fit:cover}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}
.seg button{border:1px solid var(--line);padding:10px 0;font-size:13px;font-weight:700;color:var(--muted)}
.seg button[aria-pressed="true"]{border-color:var(--ink);color:var(--ink);background:var(--tile)}
.err{color:var(--bad);font-size:13px;font-weight:700;margin:0}
.reg .actions{margin-top:auto;display:grid;grid-template-columns:1fr 2fr;gap:8px}
.reg .actions .btn{width:100%;text-align:center}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

</head>
<body>
<style>
/* 로그인·승인대기·관리 화면 */
.auth{max-width:380px;margin:70px auto 120px;display:flex;flex-direction:column;gap:16px}
.auth h2{margin:0;font-size:22px;font-weight:800;color:var(--ink)}
.auth .sub{margin:-8px 0 6px;color:var(--muted);font-size:13px}
.auth label{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:700;color:var(--ink)}
.auth input{font:400 14px var(--font);color:var(--fg);background:var(--bg);border:1px solid var(--line);padding:11px 12px;width:100%}
.auth input:focus{outline:none;border-color:var(--ink)}
.auth .btn{width:100%;text-align:center}
.auth .switch{font-size:13px;color:var(--muted);text-align:center}
.auth .switch button{color:var(--ink);font-weight:700;border-bottom:1px solid var(--ink)}
.msg{font-size:13px;margin:0;font-weight:700}
.msg.err{color:var(--bad)}.msg.ok{color:var(--ok)}
.hd .right{display:flex;align-items:center;gap:16px;font-size:13px}
.hd .right .who{color:var(--fg);font-weight:700}
.hd .right button{color:var(--muted);font-size:12.5px;border-bottom:1px solid var(--line)}
.hd .right button:hover{color:var(--ink);border-color:var(--ink)}
.admin table{width:100%;border-collapse:collapse;font-size:13.5px}
.admin th,.admin td{text-align:left;padding:12px 8px;border-bottom:1px solid var(--line)}
.admin th{font-size:12px;color:var(--muted);font-weight:700}
.admin td .btn{padding:7px 14px;font-size:12.5px}
.admin .tw{overflow-x:auto}
.loading{padding:80px 0;text-align:center;color:var(--muted)}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;font-size:13px;font-weight:700;z-index:20;max-width:calc(100vw - 32px)}
[hidden]{display:none!important}
.pic img{cursor:zoom-in}
.linkrow{display:flex;gap:8px;align-items:flex-end}
.linkrow label{flex:1;min-width:0}
.linkrow .btn{padding:11px 14px;font-size:12.5px;white-space:nowrap}
.pick{display:grid;grid-template-columns:repeat(auto-fill,minmax(78px,1fr));gap:6px}
.pick button{position:relative;aspect-ratio:4/5;background:var(--tile);border:2px solid transparent;overflow:hidden;padding:0}
.pick button img{width:100%;height:100%;object-fit:cover;display:block}
.pick button[aria-pressed="true"]{border-color:var(--ink)}
.pick button[aria-pressed="true"]::after{content:"✓";position:absolute;top:4px;right:4px;background:var(--ink);color:var(--bg);font-size:11px;font-weight:800;width:18px;height:18px;display:grid;place-items:center}
.pickmsg{font-size:12.5px;color:var(--muted);margin:0}
.pickmsg.err{color:var(--bad);font-weight:700}
.getpic{margin-top:10px;width:100%;text-align:center;padding:9px 0;font-size:12.5px}
#pickDlg form{padding:24px;display:flex;flex-direction:column;gap:14px}
#pickDlg h3{margin:0;font-size:18px;font-weight:800;color:var(--ink)}
</style>

<header class="hd gut"><div class="inner">
  <h1 class="mark">MDI<span>BOOKING</span></h1>
  <div class="right" id="hdRight"></div>
</div></header>

<main class="gut"><div class="inner" id="root"><div class="loading">불러오는 중…</div></div></main>
<footer class="gut"><div class="inner"><b>MDI MODEL MANAGEMENT</b><span>후보 · 컨택 중 · 진행 중 · 체류 중 · 불발 리스트</span></div></footer>
<div class="toast" id="toast" hidden></div>

<dialog id="dlg">
  <form class="reg" id="regForm" novalidate>
    <div class="top"><h3>후보 등록</h3><button type="button" class="x" id="cancelReg" aria-label="닫기">×</button></div>
    <p class="hint">모델 링크를 넣으면 메인 사진을 자동으로 불러옵니다. 링크가 없으면 사진을 직접 올려 주세요.</p>
    <div class="linkrow"><label for="f-link">모델 링크<input id="f-link" type="url" placeholder="에이전시 보드, 인스타그램 등 https://"></label><button type="button" class="btn line" id="scanBtn">다시 불러오기</button></div>
    <p class="pickmsg" id="pickMsg" hidden></p>
    <div class="pick" id="pick"></div>
    <label class="drop" id="drop" for="f-photos"><span id="dropTxt">사진을 끌어다 놓거나 눌러서 선택 · 여러 장 가능</span><input id="f-photos" type="file" accept="image/*" multiple></label>
    <div class="thumbs" id="thumbs"></div>
    <div class="row2">
      <label for="f-name">모델 이름 *<input id="f-name" required></label>
      <label for="f-agency">마더에이전시<input id="f-agency"></label>
    </div>
    <div><label style="margin-bottom:6px">게런티</label>
      <div class="seg" id="gseg"><button type="button" data-g="" aria-pressed="true">미정</button><button type="button" data-g="yes" aria-pressed="false">있음</button><button type="button" data-g="no" aria-pressed="false">없음</button></div></div>
    <label for="f-gamt" id="gamtWrap" hidden>게런티 금액<input id="f-gamt" placeholder="예: 5,000,000원"></label>
    <label for="f-memo">정보·메모<textarea id="f-memo" rows="3" placeholder="치수, 경력, 가능 일정 등"></textarea></label>
    <p class="err" id="regErr" hidden></p>
    <div class="actions"><button type="button" class="btn line" id="cancelReg2">취소</button><button type="submit" class="btn" id="regSubmit">등록하고 투표 시작</button></div>
  </form>
</dialog>
<dialog id="pickDlg"><form method="dialog" id="pickForm">
  <h3>링크에서 사진 가져오기</h3>
  <p class="pickmsg" id="pdMsg">불러오는 중…</p>
  <div class="pick" id="pdPick"></div>
  <div class="actions" style="display:grid;grid-template-columns:1fr 2fr;gap:8px"><button type="button" class="btn line" id="pdCancel">취소</button><button type="button" class="btn" id="pdOk" disabled>선택한 사진 저장</button></div>
</form></dialog>

    <p class="sub">${mode==="login"?"MDI 부킹 보드는 승인된 사내 인원만 사용할 수 있습니다.":"가입 후 관리자가 승인하면 사용할 수 있습니다."}</p>
    ${mode==="signup"?`<label for="a-name">이름 또는 직함<input id="a-name" autocomplete="name" required></label>`:""}
    <label for="a-email">이메일<input id="a-email" type="email" autocomplete="email" required></label>
    <label for="a-pw">비밀번호<input id="a-pw" type="password" autocomplete="${mode==="login"?"current-password":"new-password"}" required minlength="6"></label>
    <p class="msg" id="aMsg" ${msg?"":"hidden"}>${esc(msg)}</p>
    <button class="btn" type="submit">${mode==="login"?"로그인":"가입하기"}</button>
    <p class="switch">${mode==="login"?`처음이신가요? <button type="button" id="aSwitch">가입하기</button>`:`이미 계정이 있나요? <button type="button" id="aSwitch">로그인</button>`}</p>
  </form>`;
  document.getElementById("aSwitch").onclick=()=>authView(mode==="login"?"signup":"login");
  const f=document.getElementById("authForm"),m=document.getElementById("aMsg");
  const say=(t,ok)=>{m.textContent=t;m.className="msg "+(ok?"ok":"err");m.hidden=false};
  f.onsubmit=async e=>{
    e.preventDefault();
    const email=document.getElementById("a-email").value.trim(),pw=document.getElementById("a-pw").value;
    if(!email||!pw)return say("이메일과 비밀번호를 입력하세요.");
    const btn=f.querySelector("button[type=submit]");btn.disabled=true;
    if(mode==="login"){
      const {error}=await sb.auth.signInWithPassword({email,password:pw});
      btn.disabled=false;
      if(error)say(/confirm/i.test(error.message)?"이메일 인증이 아직 안 됐습니다. 메일함의 인증 링크를 먼저 눌러 주세요.":"이메일 또는 비밀번호가 맞지 않습니다.");
    }else{
      const name=document.getElementById("a-name").value.trim();
      if(!name){btn.disabled=false;return say("이름 또는 직함을 입력하세요.")}
      if(pw.length<6){btn.disabled=false;return say("비밀번호는 6자 이상이어야 합니다.")}
      const {data,error}=await sb.auth.signUp({email,password:pw,options:{data:{display_name:name},emailRedirectTo:location.origin+location.pathname}});
      btn.disabled=false;
      if(error)return say("가입하지 못했습니다: "+error.message);
      if(!data.session)authView("login","가입 완료. 메일함의 인증 링크를 누른 뒤 로그인해 주세요.");
    }
  };
}

/* ---------- 데이터 ---------- */
const name=uid=>members.find(m=>m.id===uid)?.display_name||"알 수 없음";
const approvedMembers=()=>members.filter(m=>m.approved);
function vOf(cid){return votes.filter(v=>v.candidate_id===cid)}
function stats(it){const v=vOf(it.id).map(x=>x.score);const n=v.length;const avg=n?v.reduce((a,b)=>a+b,0)/n:0;return {n,avg,pct:avg/10}}
const deadline=it=>new Date(it.deadline).getTime();
const closed=it=>Date.now()>=deadline(it);
function passed(it){const s=stats(it);return s.n>0&&s.pct>=PASS}
function stageOf(it){if(!closed(it))return "후보";return passed(it)?"컨택 중":"후보"}
function left(ms){if(ms<=0)return "마감";const s=Math.floor(ms/1000),d=Math.floor(s/86400),h=Math.floor(s%86400/3600),m=Math.floor(s%3600/60),x=s%60,p=n=>String(n).padStart(2,"0");return (d?d+"일 ":"")+p(h)+":"+p(m)+":"+p(x)}

async function loadAll(){
  const [c,v,p]=await Promise.all([
    sb.from("candidates").select("*").order("created_at",{ascending:false}),
    sb.from("votes").select("candidate_id,user_id,score"),
    sb.from("profiles").select("id,display_name,role,approved,created_at").order("created_at")
  ]);
  if(c.error||v.error||p.error)throw (c.error||v.error||p.error);
  items=c.data;votes=v.data;members=p.data;
  const paths=[...new Set(items.flatMap(i=>i.photos.slice(0,2)))].filter(x=>!photoUrls[x]);
  if(paths.length){
    const {data}=await sb.storage.from(BUCKET).createSignedUrls(paths,60*60*6);
    (data||[]).forEach(d=>{if(d.signedUrl)photoUrls[d.path]=d.signedUrl});
  }
}
let reloadT=null;
function scheduleReload(){clearTimeout(reloadT);reloadT=setTimeout(async()=>{try{await loadAll();render()}catch(e){console.error(e)}},300)}
function subscribe(){
  if(channel)return;
  channel=sb.channel("board").on("postgres_changes",{event:"*",schema:"public",table:"candidates"},scheduleReload)
    .on("postgres_changes",{event:"*",schema:"public",table:"votes"},scheduleReload).subscribe();
}

function tabsHtml(){

  return `<nav class="tabs" role="tablist">${STAGES.map(s=>`<button role="tab" aria-selected="${s===tab}" data-tab="${s}">${s}<span class="n">${c[s]}</span></button>`).join("")}</nav>`;
}
function head(stage,desc,extra="",right=""){return `<section class="ph-head"><div class="l"><h2>${stage}<span class="en">${EN[stage]}</span></h2>${desc?`<p>${desc}</p>`:""}${extra}</div>${right?`<div class="r">${right}</div>`:""}</section>`}

function card(it){
  const s=stats(it),dl=deadline(it),rem=dl-Date.now(),isClosed=rem<=0,ok=passed(it);
  const mine=vOf(it.id).find(v=>v.user_id===me.id)?.score;
  const urls=it.photos.slice(0,2).map(p=>photoUrls[p]).filter(Boolean);
  const media=urls.length?`<div class="strip">${urls.map(u=>`<img src="${esc(u)}" alt="${esc(it.name)} 사진" data-full="${esc(u)}">`).join("")}</div>`
    :`<div class="noimg"><div><b>${esc((it.name||"?").trim().charAt(0).toUpperCase())}</b>${it.photos.length?"사진 불러오는 중":(it.link?"링크로 등록 · 사진 없음":"사진 없음")}</div></div>`;
  const scls=isClosed?"done":(rem<12*H?"soon":"");
  const g=it.gtype==="yes"?esc(it.gamt||"금액 미입력"):it.gtype==="no"?"없음":"미정";
  const voters=approvedMembers();
  const vmap=Object.fromEntries(vOf(it.id).map(v=>[v.user_id,v.score]));
  return `<article class="card" data-card="${it.id}">
    <div class="pic">${media}</div>
    <p class="name">${esc(it.name)}</p>
    <p class="status ${scls}" data-timer="${it.id}">${isClosed?`마감 ${fmt(dl)}`:`남은 시간 <span data-left="${it.id}" data-dl="${dl}">${left(rem)}</span>`}</p>
    <dl class="info">
      <dt>Agency</dt><dd>${esc(it.agency||"미입력")}</dd>
      <dt>Guarantee</dt><dd>${g}</dd>
      ${it.link?`<dt>Link</dt><dd><a href="${esc(it.link)}" target="_blank" rel="noopener">열기 ↗</a></dd>`:""}
      ${it.memo?`<dt>Memo</dt><dd>${esc(it.memo)}</dd>`:""}
    </dl>
    <div class="score">
      <div class="top"><span class="avg">${s.n?s.avg.toFixed(1):"–"}<small>/ 10</small></span><span class="st ${ok?"ok":""}">${s.n?`${Math.round(s.pct*100)}% · ${ok?"통과선 이상":"통과선 미만"}`:"투표 없음"}</span></div>
      <div class="bar" title="분홍 선이 통과선 6.0점(60%)"><i class="${ok?"ok":""}" style="width:${Math.min(100,s.pct*100)}%"></i><span class="cut"></span></div>
      <div class="bar-lab"><span>0</span><span class="c">6.0</span><span>10</span></div>
    </div>
    ${isClosed?`<div class="result ${ok?"pass":"fail"}"><span>${ok?"통과 → 컨택 중":"미통과"}</span><span>${s.n?s.avg.toFixed(1)+"점":"투표 없음"}</span></div>`
      :`<div class="vote" role="group" aria-label="${esc(it.name)} 점수">${Array.from({length:10},(_,i)=>i+1).map(n=>`<button type="button" data-v="${n}" data-id="${it.id}" aria-pressed="${mine===n}" aria-label="${n}점">${n}</button>`).join("")}</div>
        <p class="mine">${mine?`내 점수 <b>${mine}점</b> · 다시 누르면 변경`:"아직 투표하지 않았습니다"}</p>`}
    <details class="who" data-whobox="${it.id}" ${openWho.has(it.id)?"open":""}>
      <summary><span>투표자 명단<span class="c">${s.n}/${voters.length}명</span></span><span class="pm" aria-hidden="true"></span></summary>
      <dl>${voters.map(m=>vmap[m.id]!=null?`<dt>${esc(m.display_name)}</dt><dd>${vmap[m.id]}점</dd>`:`<dt class="no">${esc(m.display_name)}</dt><dd class="no">미투표</dd>`).join("")}</dl>
    </details>
    ${it.link&&!it.photos.length&&(it.created_by===me.id||profile.role==="admin")?`<button class="btn line getpic" data-getpic="${it.id}">링크에서 사진 가져오기</button>`:""}
    <p class="by">등록 ${esc(name(it.created_by))} · ${fmt(it.created_at)}</p>
  </article>`;
}

function render(){
  header();
  try{localStorage.setItem("mdi-tab",tab)}catch(e){}
  if(tab==="관리")return adminView();
  const list=items.filter(it=>stageOf(it)===tab);
  let html=tabsHtml();
  if(tab==="후보"){
    const open=list.filter(it=>!closed(it)).sort((a,b)=>deadline(a)-deadline(b));
    const fail=list.filter(it=>closed(it));
    const soon=open.filter(it=>deadline(it)-Date.now()<24*H).length;
    const notMine=open.filter(it=>!vOf(it.id).some(v=>v.user_id===me.id)).length;
    html+=head("후보","전원 1~10점 투표 · 3일 뒤 평균 6.0점(60%) 이상이면 컨택 중으로 이동",
        `<div class="facts"><span>투표 중<b>${open.length}</b></span><span>24시간 내 마감<b>${soon}</b></span><span>내가 아직 안 한 투표<b>${notMine}</b></span></div>`,
        `<button class="btn" id="openReg">+ 후보 등록</button>`)+
      (open.length?`<div class="grid">${open.map(card).join("")}</div>`:`<div class="empty"><b>투표 중인 후보가 없습니다</b>오른쪽 위 ‘후보 등록’에서 모델 링크나 사진을 올리면 3일 투표가 시작됩니다.</div>`)+
      (fail.length?`<div class="sec"><h3>마감 · 미통과 ${fail.length}명</h3><span class="en">CLOSED</span></div><div class="grid">${fail.map(card).join("")}</div>`:"");
  }else if(tab==="컨택 중"){
    html+=head("컨택 중","투표를 통과한 모델 · 다음 단계로 넘기는 기능은 기준이 정해지면 추가")+
      (list.length?`<div class="grid">${list.map(card).join("")}</div>`:`<div class="empty"><b>아직 통과한 모델이 없습니다</b>후보 투표가 마감되면 통과한 모델이 여기로 옵니다.</div>`);
  }else{
    html+=head(tab,"")+`<div class="empty"><b>준비 중</b>${tab} 화면은 다음 단계에서 만듭니다.</div>`;
  }
  root.innerHTML=html;
  root.querySelectorAll("[data-tab]").forEach(b=>b.onclick=()=>{tab=b.dataset.tab;render()});
  const o=document.getElementById("openReg");if(o)o.onclick=openReg;
  root.querySelectorAll("[data-whobox]").forEach(d=>d.ontoggle=()=>{d.open?openWho.add(d.dataset.whobox):openWho.delete(d.dataset.whobox)});
  root.querySelectorAll("[data-getpic]").forEach(b=>b.onclick=()=>openPickFor(items.find(x=>x.id===b.dataset.getpic)));
  root.querySelectorAll("img[data-full]").forEach(i=>i.onclick=()=>window.open(i.dataset.full,"_blank","noopener"));
  root.querySelectorAll(".vote button").forEach(b=>b.onclick=async()=>{
    const it=items.find(x=>x.id===b.dataset.id);if(!it||closed(it))return;
    const score=+b.dataset.v;
    const prev=votes.find(v=>v.candidate_id===it.id&&v.user_id===me.id);
    if(prev)prev.score=score;else votes.push({candidate_id:it.id,user_id:me.id,score});
    render();
    const {error}=await sb.from("votes").upsert({candidate_id:it.id,user_id:me.id,score,updated_at:new Date().toISOString()},{onConflict:"candidate_id,user_id"});
    if(error){toast("투표가 저장되지 않았습니다: "+error.message);await loadAll();render()}
  });
}

function shrink(file){return new Promise(res=>{const r=new FileReader();r.onload=()=>{const img=new Image();img.onload=()=>{const max=1400,sc=Math.min(1,max/Math.max(img.width,img.height));const c=document.createElement("canvas");c.width=Math.max(1,Math.round(img.width*sc));c.height=Math.max(1,Math.round(img.height*sc));c.getContext("2d").drawImage(img,0,0,c.width,c.height);c.toBlob(b=>res(b?{blob:b,preview:URL.createObjectURL(b)}:null),"image/jpeg",.85)};img.onerror=()=>res(null);img.src=r.result};r.onerror=()=>res(null);r.readAsDataURL(file)})}
async function addFiles(files){
  const imgs=[...files].filter(f=>f.type.startsWith("image/"));
  pending=pending.concat((await Promise.all(imgs.map(shrink))).filter(Boolean));
  document.getElementById("thumbs").innerHTML=pending.map(p=>`<img src="${p.preview}" alt="미리보기">`).join("");
  document.getElementById("dropTxt").textContent=pending.length?`사진 ${pending.length}장 선택됨 · 더 추가하려면 누르기`:"사진을 끌어다 놓거나 눌러서 선택 · 여러 장 가능";
  err.hidden=true;
}

["dragleave","drop"].forEach(t=>drop.addEventListener(t,e=>{e.preventDefault();drop.classList.remove("on")}));

let linkSel=[],linkPage="";
async function callFn(body){

  if(error){let m=error.message;try{const j=await error.context.json();if(j.error)m=j.error}catch(e){}throw new Error(m)}
  return data;
}
async function scanLink(url){return callFn({action:"scan",url})}

function drawPick(box,images,sel,onChange){

  });
}
let scannedLink="",scanning=null;
async function runScan(quiet){
  const link=document.getElementById("f-link").value.trim(),msg=document.getElementById("pickMsg"),box=document.getElementById("pick");
  if(quiet&&(!/^https?:\/\/\S+\.\S+/i.test(link)||link===scannedLink))return;
  scannedLink=link;
  if(!/^https?:\/\//i.test(link)){msg.textContent="http:// 또는 https:// 로 시작하는 링크를 먼저 넣어 주세요.";msg.className="pickmsg err";msg.hidden=false;return}
  msg.textContent="링크에서 사진을 찾는 중…";msg.className="pickmsg";msg.hidden=false;box.innerHTML="";linkSel=[];
  try{
    const r=await scanLink(link);linkPage=r.url||link;
    const nm=document.getElementById("f-name");if(!nm.value.trim()&&!nm.dataset.dirty&&document.activeElement!==nm&&r.title)nm.value=r.title;
    if(!r.images.length){msg.textContent="이 링크에서 사진을 찾지 못했습니다. 사진을 직접 올려 주세요.";msg.className="pickmsg err";return}
    if(r.suggested)linkSel=[r.suggested];
    msg.textContent=`메인 사진을 자동으로 골랐습니다(✓). 틀렸으면 다른 사진을 눌러 바꾸세요. 찾은 사진 ${r.images.length}장 · 최대 6장 · 먼저 고른 사진이 메인`;
    drawPick(box,r.images,linkSel);
  }catch(e){msg.textContent="불러오지 못했습니다: "+e.message+" — 사진을 직접 올려 주세요.";msg.className="pickmsg err"}
}
document.getElementById("scanBtn").onclick=()=>{scannedLink="";scanning=runScan(false)};
const linkInput=document.getElementById("f-link");
document.getElementById("f-name").addEventListener("input",e=>{e.target.dataset.dirty="1"});
linkInput.addEventListener("change",()=>{scanning=runScan(true)});
linkInput.addEventListener("paste",()=>setTimeout(()=>{scanning=runScan(true)},0));
linkInput.addEventListener("input",()=>{clearTimeout(linkInput._t);linkInput._t=setTimeout(()=>{scanning=runScan(true)},900)});
const pickDlg=document.getElementById("pickDlg");let pickTarget=null,pdSel=[];
document.getElementById("pdCancel").onclick=()=>pickDlg.close();
async function openPickFor(it){
  if(!it)return;pickTarget=it;pdSel=[];
  const msg=document.getElementById("pdMsg"),box=document.getElementById("pdPick"),ok=document.getElementById("pdOk");
  msg.textContent="링크에서 사진을 찾는 중…";msg.className="pickmsg";box.innerHTML="";ok.disabled=true;pickDlg.showModal();
  try{
    const r=await scanLink(it.link);pickTarget._page=r.url||it.link;
    if(!r.images.length){msg.textContent="이 링크에서 사진을 찾지 못했습니다.";msg.className="pickmsg err";return}
    if(r.suggested)pdSel=[r.suggested];
    msg.textContent=`사진 ${r.images.length}장을 찾았습니다. 쓸 사진을 고르세요 (최대 6장, 먼저 고른 사진이 메인).`;
    const sync=()=>ok.disabled=!pdSel.length;drawPick(box,r.images,pdSel,sync);sync();
  }catch(e){msg.textContent="불러오지 못했습니다: "+e.message;msg.className="pickmsg err"}
}
document.getElementById("pdOk").onclick=async()=>{
  const ok=document.getElementById("pdOk"),msg=document.getElementById("pdMsg");ok.disabled=true;ok.textContent="저장 중…";
  try{
    const r=await importImages(pdSel,pickTarget._page);
    if(!r.paths.length)throw new Error("사진을 가져오지 못했습니다 (사이트가 차단했을 수 있습니다)");
    const {error}=await sb.from("candidates").update({photos:r.paths}).eq("id",pickTarget.id);
    if(error)throw error;
    pickDlg.close();toast(r.failed.length?`${r.paths.length}장 저장, ${r.failed.length}장 실패`:"사진을 저장했습니다");
    await loadAll();render();
  }catch(e){msg.textContent=e.message;msg.className="pickmsg err"}
  finally{ok.textContent="선택한 사진 저장";ok.disabled=!pdSel.length}
};
form.onsubmit=async e=>{
  e.preventDefault();
  const link=document.getElementById("f-link").value.trim(),nm=document.getElementById("f-name").value.trim(),msg=[];
  if(!nm)msg.push("모델 이름을 입력하세요.");
  if(!link&&!pending.length)msg.push("모델 링크나 사진 중 하나는 넣어야 합니다.");
  if(link&&!/^https?:\/\//i.test(link))msg.push("링크는 http:// 또는 https:// 로 시작해야 합니다.");
  if(msg.length){err.textContent=msg.join(" ");err.hidden=false;return}
  const btn=document.getElementById("regSubmit");btn.disabled=true;btn.textContent="올리는 중…";
  try{
    const paths=[];
    if(link&&link!==scannedLink){btn.textContent="링크 사진 찾는 중…";scanning=runScan(true)}
    if(scanning){try{await scanning}catch(e){}}
    if(linkSel.length){
      btn.textContent="링크 사진 가져오는 중…";
      const r=await importImages(linkSel,linkPage||link);
      paths.push(...r.paths);
      if(r.failed.length)toast(`링크 사진 ${r.failed.length}장은 가져오지 못했습니다`);
      btn.textContent="올리는 중…";
    }
    for(const p of pending){
      const path=`${me.id}/${Date.now()}-${Math.random().toString(36).slice(2,8)}.jpg`;
      const {error}=await sb.storage.from(BUCKET).upload(path,p.blob,{contentType:"image/jpeg"});
      if(error)throw new Error("사진 업로드 실패: "+error.message);
      paths.push(path);
    }
    const {error}=await sb.from("candidates").insert({name:nm,agency:document.getElementById("f-agency").value.trim(),link,photos:paths,gtype,
      gamt:gtype==="yes"?document.getElementById("f-gamt").value.trim():"",memo:document.getElementById("f-memo").value.trim(),created_by:me.id});
    if(error)throw new Error("등록 실패: "+error.message);
    dlg.close();tab="후보";toast("등록했습니다. 3일 투표가 시작됐습니다.");
    await loadAll();render();
  }catch(ex){err.textContent=ex.message;err.hidden=false}
  finally{btn.disabled=false;btn.textContent="등록하고 투표 시작"}
};

/* ---------- 시작 ---------- */
async function boot(session){
  me=session?.user||null;
  if(!me){if(channel){sb.removeChannel(channel);channel=null}return authView()}
  const {data,error}=await sb.from("profiles").select("*").eq("id",me.id).maybeSingle();
  if(error){root.innerHTML=`<div class="empty"><b>정보를 불러오지 못했습니다</b>${esc(error.message)}</div>`;return}
  profile=data;
  if(!profile?.approved)return pendingView();
  root.innerHTML=`<div class="loading">불러오는 중…</div>`;
  try{await loadAll()}catch(e){root.innerHTML=`<div class="empty"><b>데이터를 불러오지 못했습니다</b>${esc(e.message)}</div>`;return}
  subscribe();render();
}
let lastUid;
sb.auth.onAuthStateChange((ev,session)=>{
  const uid=session?.user?.id||null;
  if(ev==="TOKEN_REFRESHED"&&uid===lastUid)return;
  lastUid=uid;setTimeout(()=>boot(session),0);
});
})();
</script>
